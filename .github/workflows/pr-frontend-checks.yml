name: PR Frontend Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - '!src/apps/api/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: './src/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Lint
        run: |
          pnpm exec nx affected --target=lint \
            --exclude=teensyrom-ui-e2e,TeensyRom.Api.Tests.Integration,TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api,TeensyRom.Core,TeensyRom.Core.Device,TeensyRom.Core.Serial,TeensyRom.Core.Storage,TeensyRom.Tools.DeepSidExporter

      - name: Type Check
        run: |
          pnpm exec nx affected --target=typecheck \
            --exclude=teensyrom-ui-e2e,TeensyRom.Api.Tests.Integration,TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api,TeensyRom.Core,TeensyRom.Core.Device,TeensyRom.Core.Serial,TeensyRom.Core.Storage,TeensyRom.Tools.DeepSidExporter

      # Budget defaults to 180s in the wrapper; override by setting a
      # TEST_BUDGET_SECONDS env var on this step (no script edit needed) to
      # diagnose a failing run without changing the enforced bar.
      - name: Unit Tests
        timeout-minutes: 10
        run: |
          node scripts/ci/test-with-budget.mjs -- affected --target=test --parallel=4 \
            --exclude=teensyrom-ui-e2e,TeensyRom.Api.Tests.Integration,TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api,TeensyRom.Core,TeensyRom.Core.Device,TeensyRom.Core.Serial,TeensyRom.Core.Storage,TeensyRom.Tools.DeepSidExporter

