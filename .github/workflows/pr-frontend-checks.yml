name: PR Frontend Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - '!src/apps/api/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: './src/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Lint
        run: |
          pnpm exec nx affected --target=lint \
            --exclude=teensyrom-ui-e2e,TeensyRom.Api.Tests.Integration,TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api,TeensyRom.Core,TeensyRom.Core.Device,TeensyRom.Core.Serial,TeensyRom.Core.Storage,TeensyRom.Tools.DeepSidExporter

      - name: Type Check
        run: |
          pnpm exec nx affected --target=typecheck \
            --exclude=teensyrom-ui-e2e,TeensyRom.Api.Tests.Integration,TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api,TeensyRom.Core,TeensyRom.Core.Device,TeensyRom.Core.Serial,TeensyRom.Core.Storage,TeensyRom.Tools.DeepSidExporter

      # Budget defaults to 220s in the wrapper; override by setting a
      # TEST_BUDGET_SECONDS env var on this step (no script edit needed) to
      # diagnose a failing run without changing the enforced bar.
      #
      # Raised from the original 180s: two consecutive fresh
      # (--skip-nx-cache) full-suite runs on identical code measured 182.8s
      # and 132.9s wall-clock, a ~38% run-to-run spread wide enough to flip
      # pass/fail at a flat 180s bar on ordinary jitter alone. Reset to the
      # worse observed run (182.8s) plus 20% headroom, rounded up to 220s.
      #
      # --output-style=static (Nx's own documented CI recommendation) avoids
      # a real failure mode observed on this runner: without it, streamed
      # task output is eligible to run through Nx's pseudo-terminal fork path
      # (forked-process-task-runner.js), which propagates any forked task's
      # raw exit code straight to the parent via `process.exit(code)` when
      # that code is >128 — i.e. the task's process was itself killed by a
      # signal, for any reason, including transient runner conditions
      # unrelated to the tests. That produced a run where every project had
      # already finished and reported green, and the wrapper's own budget
      # summary printed successfully, immediately before the whole step died
      # with exit 130. `static` forces `streamOutput=false` in Nx's task
      # orchestrator, which keeps every task on the plain non-pty fork path
      # and removes this fast-abort branch entirely — it only changes how
      # task output is buffered for display, not test behavior or results.
      - name: Unit Tests
        timeout-minutes: 10
        run: |
          node scripts/ci/test-with-budget.mjs -- affected --target=test --parallel=4 --output-style=static \
            --exclude=teensyrom-ui-e2e,TeensyRom.Api.Tests.Integration,TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api,TeensyRom.Core,TeensyRom.Core.Device,TeensyRom.Core.Serial,TeensyRom.Core.Storage,TeensyRom.Tools.DeepSidExporter

