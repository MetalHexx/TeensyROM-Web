name: PR Backend Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/apps/api/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DOTNET_VERSION: '9.0.x'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  backend-checks:
    name: .NET Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: './src/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Restore .NET dependencies
        run: pnpm exec nx run-many --target=restore --projects=TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests

      - name: Build .NET test projects
        run: pnpm exec nx run-many --target=build --projects=TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests

      - name: Run .NET Unit Tests
        run: pnpm exec nx run-many --target=test --projects=TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests
