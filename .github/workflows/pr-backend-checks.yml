name: PR Backend Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/apps/api/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DOTNET_VERSION: '9.0.x'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  backend-checks:
    name: .NET Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: './src/pnpm-lock.yaml'

      # `src/package.json` depends on @sidablist/core and @sidablist/asid via relative file:/link:
      # paths (../../SIDablist/libs/{core,asid}) — a deliberate choice over a published, versioned
      # package (see src/libs/poc/dj-player/README.md), so a standalone checkout of this repo alone
      # cannot resolve them. Check out the matching SIDablist branch when one exists (a coupled
      # cross-repo change lands on both under the same branch name), falling back to main.
      - name: Determine SIDablist ref to check out
        id: sidablist-ref
        working-directory: ${{ github.workspace }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/MetalHexx/SIDablist.git "$BRANCH" > /dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      # actions/checkout refuses a `path` outside $GITHUB_WORKSPACE, but package.json's relative
      # dependency needs a true sibling of this checkout, not a nested directory — hence the move.
      - name: Checkout SIDablist (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: MetalHexx/SIDablist
          ref: ${{ steps.sidablist-ref.outputs.ref }}
          path: SIDablist

      - name: Move SIDablist beside this checkout
        working-directory: ${{ github.workspace }}
        run: mv SIDablist ../SIDablist

      - name: Build SIDablist packages
        working-directory: ${{ github.workspace }}/../SIDablist
        run: |
          npx --yes pnpm@10.11.0 install --frozen-lockfile
          npx --yes pnpm@10.11.0 run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Restore .NET dependencies
        run: pnpm exec nx run-many --target=restore --projects=TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api.Tests.Unit,TeensyRom.Api.Tests.Integration

      - name: Build .NET test projects
        run: pnpm exec nx run-many --target=build --projects=TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api.Tests.Unit,TeensyRom.Api.Tests.Integration

      - name: Run .NET Unit Tests
        run: pnpm exec nx run-many --target=test --projects=TeensyRom.Core.Tests,TeensyRom.Core.Storage.Tests,TeensyRom.Api.Tests.Unit

      # TeensyRom.Api.Tests.Integration also contains pre-existing [Collection("Endpoint")] tests that
      # require a physical TeensyROM device (real serial-port/subnet discovery via EndpointFixture).
      # This filter runs only the new hardware-free FILE-TRANSFER-1 tests, which live under the
      # TeensyRom.Api.Tests.Integration.Transfers namespace and use TransferFixture's fake device port.
      - name: Run .NET Transfer Integration Tests
        run: dotnet test apps/api/src/TeensyRom.Api.Tests.Integration/TeensyRom.Api.Tests.Integration.csproj --no-build --filter "FullyQualifiedName~TeensyRom.Api.Tests.Integration.Transfers"
