<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Gradient definitions for synthwave colors -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(20,20,30);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(40,20,60);stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sunGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:rgb(255,100,200);stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:rgb(137,0,137);stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:rgb(137,0,137);stop-opacity:0" />
    </radialGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="100%">
      <stop offset="0%" style="stop-color:rgb(0,247,255);stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:rgb(0,150,200);stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  
  <!-- Sun glow at top -->
  <ellipse cx="400" cy="100" rx="300" ry="200" fill="url(#sunGlow)"/>
  
  <!-- Horizon glow -->
  <ellipse cx="400" cy="600" rx="400" ry="300" fill="url(#horizonGlow)"/>
  
  <!-- Perspective grid -->
  <g opacity="0.15" stroke="rgb(137,0,137)" stroke-width="1" fill="none">
    <!-- Horizontal lines with perspective -->
    <path d="M 100 300 Q 400 305 700 300" stroke-opacity="0.8"/>
    <path d="M 150 320 Q 400 328 650 320" stroke-opacity="0.7"/>
    <path d="M 200 345 Q 400 358 600 345" stroke-opacity="0.6"/>
    <path d="M 250 375 Q 400 395 550 375" stroke-opacity="0.5"/>
    <path d="M 280 410 Q 400 440 520 410" stroke-opacity="0.4"/>
    <path d="M 310 450 Q 400 490 490 450" stroke-opacity="0.3"/>
    <path d="M 340 495 Q 400 545 460 495" stroke-opacity="0.25"/>
    <path d="M 370 545 Q 400 600 430 545" stroke-opacity="0.2"/>
  </g>
  
  <!-- Vertical grid lines with perspective -->
  <g opacity="0.12" stroke="rgb(0,247,255)" stroke-width="0.8" fill="none">
    <path d="M 400 300 L 400 600" stroke-opacity="0.6"/>
    <path d="M 350 300 Q 350 400 360 600" stroke-opacity="0.5"/>
    <path d="M 450 300 Q 450 400 440 600" stroke-opacity="0.5"/>
    <path d="M 300 300 Q 295 400 320 600" stroke-opacity="0.4"/>
    <path d="M 500 300 Q 505 400 480 600" stroke-opacity="0.4"/>
    <path d="M 250 310 Q 240 420 280 600" stroke-opacity="0.3"/>
    <path d="M 550 310 Q 560 420 520 600" stroke-opacity="0.3"/>
    <path d="M 200 320 Q 185 440 240 600" stroke-opacity="0.25"/>
    <path d="M 600 320 Q 615 440 560 600" stroke-opacity="0.25"/>
  </g>
  
  <!-- Accent stars/dots -->
  <g opacity="0.4" fill="rgb(255,255,255)">
    <circle cx="150" cy="80" r="1.5"/>
    <circle cx="280" cy="120" r="1"/>
    <circle cx="520" cy="90" r="1.5"/>
    <circle cx="650" cy="130" r="1"/>
    <circle cx="200" cy="160" r="0.8"/>
    <circle cx="600" cy="170" r="0.8"/>
  </g>
  
  <!-- Subtle scan line effect -->
  <rect width="800" height="2" y="0" fill="rgb(137,0,137)" opacity="0.05">
    <animate attributeName="y" from="-2" to="600" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
