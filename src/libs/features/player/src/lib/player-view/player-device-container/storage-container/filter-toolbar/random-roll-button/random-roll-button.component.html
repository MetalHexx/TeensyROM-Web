<lib-icon-button
  icon="casino"
  ariaLabel="Launch a random file.  Will only launch files matching the current filter."
  [tooltip]="randomTooltip"
  size="large"
  [color]="getButtonColor()"
  (buttonClick)="onButtonClick()"
  (click)="animateDiceRoll($event)"
  class="dice-icon-filled"
  data-testid="random-roll-button"
/>
