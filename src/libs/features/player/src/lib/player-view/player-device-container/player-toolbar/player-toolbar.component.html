<!-- Sliding Container with Auto-Chaining Animation -->
<lib-sliding-container
  containerHeight="80px"
  animationDirection="from-top"
  [animationTrigger]="isPlayerLoadedComputed()"
>
  <lib-scaling-compact-card animationEntry="from-top" animationParent="auto" cardClass="glassy-card">
    <!-- Progress Bar (flush to top inside card) -->
    <lib-progress-bar
      [currentValue]="currentTime()"
      [totalValue]="totalTime()"
      [show]="showProgressBar()"
    >
    </lib-progress-bar>

    <!-- Desktop Layout: Absolute centered file-info (>900px) -->
    <div class="player-controls desktop-layout" data-testid="player-toolbar">
      <div class="playback-controls">
        <lib-icon-button
          icon="skip_previous"
          ariaLabel="In shuffle mode, It will launch the previous file in your launch history. Otherwise, it will launch the previous file in the file listing."
          [tooltip]="previousTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigatePreviousComputed()"
          (buttonClick)="previous()"
        >
        </lib-icon-button>

        @if (isCurrentFileMusicTypeComputed()) {
        <lib-icon-button
          [icon]="getPlayPauseIconComputed()"
          [ariaLabel]="getPlayPauseLabelComputed()"
          [tooltip]="playPauseTooltip()"
          size="large"
          variant="rounded-primary"
          class="playback-icon-filled"
          [color]="getPlayButtonColorComputed()"
          (buttonClick)="playPause()"
        >
        </lib-icon-button>
        } @else {
        <lib-icon-button
          icon="stop"
          ariaLabel="Stops the current file with a TeensyROM reset."
          [tooltip]="stopTooltip"
          size="large"
          variant="rounded-primary"
          class="playback-icon-filled"
          [color]="getPlayButtonColorComputed()"
          (buttonClick)="stop()"
        >
        </lib-icon-button>
        }

        <lib-icon-button
          icon="skip_next"
          ariaLabel="In shuffle mode, It will launch the next random file or next file in your launch history. Otherwise, it will launch the next file in the file listing."
          [tooltip]="nextTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigateComputed()"
          (buttonClick)="next()"
        >
        </lib-icon-button>
      </div>

      <div class="time-display-section">
        <lib-file-time
          [currentTime]="currentTime()"
          [totalTime]="totalTime()"
          [show]="showProgressBar()"
        ></lib-file-time>
      </div>

      <div class="file-info-section">
        <lib-file-info [fileItem]="currentFile()?.file ?? null"></lib-file-info>
      </div>

      <div class="toolbar-actions-section">
        <lib-player-toolbar-actions [deviceId]="deviceId()"></lib-player-toolbar-actions>
      </div>
    </div>

    <!-- Tablet Layout: Flexbox with file-info in remaining space (641px-900px) -->
    <div class="player-controls tablet-layout" data-testid="player-toolbar">
      <div class="playback-controls">
        <lib-icon-button
          icon="skip_previous"
          ariaLabel="In shuffle mode, It will launch the previous file in your launch history. Otherwise, it will launch the previous file in the file listing."
          [tooltip]="previousTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigatePreviousComputed()"
          (buttonClick)="previous()"
        >
        </lib-icon-button>

        @if (isCurrentFileMusicTypeComputed()) {
        <lib-icon-button
          [icon]="getPlayPauseIconComputed()"
          [ariaLabel]="getPlayPauseLabelComputed()"
          [tooltip]="playPauseTooltip()"
          size="large"
          variant="rounded-primary"
          class="playback-icon-filled"
          [color]="getPlayButtonColorComputed()"
          (buttonClick)="playPause()"
        >
        </lib-icon-button>
        } @else {
        <lib-icon-button
          icon="stop"
          ariaLabel="Stop Playback"
          [tooltip]="stopTooltip"
          size="large"
          variant="rounded-primary"
          class="playback-icon-filled"
          [color]="getPlayButtonColorComputed()"
          (buttonClick)="stop()"
        >
        </lib-icon-button>
        }

        <lib-icon-button
          icon="skip_next"
          ariaLabel="In shuffle mode, It will launch the next random file or next file in your launch history. Otherwise, it will launch the next file in the file listing."
          [tooltip]="nextTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigateComputed()"
          (buttonClick)="next()"
        >
        </lib-icon-button>
      </div>

      <div class="time-display-section">
        <lib-file-time
          [currentTime]="currentTime()"
          [totalTime]="totalTime()"
          [show]="showProgressBar()"
        ></lib-file-time>
      </div>

      <div class="file-info-section">
        <lib-file-info [fileItem]="currentFile()?.file ?? null"></lib-file-info>
      </div>

      <div class="toolbar-actions-section">
        <lib-player-toolbar-actions [deviceId]="deviceId()"></lib-player-toolbar-actions>
      </div>
    </div>

    <!-- Mobile Layout: Stacked vertical (≤640px) -->
    <div class="player-controls mobile-layout" data-testid="player-toolbar">
      <div class="playback-controls">
        <lib-icon-button
          icon="skip_previous"
          ariaLabel="In shuffle mode, It will launch the previous file in your launch history. Otherwise, it will launch the previous file in the file listing."
          [tooltip]="previousTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigatePreviousComputed()"
          (buttonClick)="previous()"
        >
        </lib-icon-button>

        @if (isCurrentFileMusicTypeComputed()) {
        <lib-icon-button
          [icon]="getPlayPauseIconComputed()"
          [ariaLabel]="getPlayPauseLabelComputed()"
          [tooltip]="playPauseTooltip()"
          size="large"
          variant="rounded-primary"
          class="playback-icon-filled"
          [color]="getPlayButtonColorComputed()"
          (buttonClick)="playPause()"
        >
        </lib-icon-button>
        } @else {
        <lib-icon-button
          icon="stop"
          ariaLabel="Stops the current file with a TeensyROM reset."
          [tooltip]="stopTooltip"
          size="large"
          variant="rounded-primary"
          class="playback-icon-filled"
          [color]="getPlayButtonColorComputed()"
          (buttonClick)="stop()"
        >
        </lib-icon-button>
        }

        <lib-icon-button
          icon="skip_next"
          ariaLabel="In shuffle mode, It will launch the next random file or next file in your launch history. Otherwise, it will launch the next file in the file listing."
          [tooltip]="nextTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigateComputed()"
          (buttonClick)="next()"
        >
        </lib-icon-button>
      </div>

      <div class="time-display-section">
        <lib-file-time
          [currentTime]="currentTime()"
          [totalTime]="totalTime()"
          [show]="showProgressBar()"
        ></lib-file-time>
      </div>

      <div class="file-info-section">
        <lib-file-info [fileItem]="currentFile()?.file ?? null"></lib-file-info>
      </div>

      <div class="toolbar-actions-section">
        <lib-player-toolbar-actions [deviceId]="deviceId()"></lib-player-toolbar-actions>
      </div>
    </div>
  </lib-scaling-compact-card>
</lib-sliding-container>
