<div class="volume-control" [class.disabled]="disabled()">
  <lib-icon-button
    [icon]="volumeIcon()"
    [ariaLabel]="muteAriaLabel()"
    size="large"
    variant="rounded-transparent"
    [color]="isMuted() ? 'highlight' : 'normal'"
    [disabled]="disabled()"
    (buttonClick)="onToggleMute()"
  >
  </lib-icon-button>

  @if (!compact()) {
    <input
      type="range"
      class="volume-slider"
      min="0"
      max="1"
      step="0.01"
      aria-label="Volume"
      [value]="currentVolume()"
      [disabled]="disabled()"
      (input)="onVolumeChange($event)"
    />
  }
</div>
