@if (hasDevices() && !isPermissionDenied()) {
  <div class="video-container">
    <div class="video-with-settings-wrapper">
      <lib-scaling-compact-card [enableOverflow]="true">
      <lib-content-overlay-container [showOverlaysOnHover]="!isDeviceSelectorOpen()">
        <!-- Content slot: CRT wrapper around video stream -->
        <ng-container content>
          <lib-crt-effect-wrapper
            [settings]="crtSettings()"
            [config]="crtConfig"
            [enabled]="isCrtEnabled()">
            <lib-video-stream 
              [stream]="currentStream()" 
              [objectFit]="'contain'">
            </lib-video-stream>
          </lib-crt-effect-wrapper>
        </ng-container>

        <!-- Top right corner: Device selector (always rendered, visibility controlled by CSS) -->
        <lib-video-device-selector
          topRightCorner
          [visible]="showDeviceSelector()"
          [devices]="devices()"
          [selectedDeviceId]="selectedDevice() ?? ''"
          (deviceSelected)="onDeviceSelected($event)"
          (openedChange)="onDeviceSelectorOpenedChange($event)">
        </lib-video-device-selector>

        <!-- Top left corner: CRT settings panel (always rendered when CRT enabled, visibility controlled by CSS) -->
        @if (isCrtEnabled()) {
          <lib-crt-settings-panel
            topLeftCorner
            [settings]="crtSettings()"
            [config]="crtConfig"
            [visible]="showCrtControls()"
            cardClass="crt-panel-scrollable"
            [class.panel-hidden]="!showCrtControls()"
            (settingsChange)="onCrtSettingsChange($event)"
            (resetRequested)="onCrtReset()"
            (presetSelected)="onCrtPresetSelected($event)">
          </lib-crt-settings-panel>
        }

        <!-- Right controls toolbar -->
        <lib-video-controls-toolbar
          rightControls
          [isCrtEnabled]="isCrtEnabled()"
          [showCrtControls]="showCrtControls()"
          [isDeviceSelectorActive]="showDeviceSelector()"
          [showFullscreen]="true"
          [showClose]="false"
          (crtToggleClick)="toggleCrtEffect()"
          (crtSettingsClick)="toggleCrtControls()"
          (deviceSelectorClick)="toggleDeviceSelector()"
          (fullscreenClick)="openVideoDialog()">
        </lib-video-controls-toolbar>
      </lib-content-overlay-container>
    </lib-scaling-compact-card>
    </div>
  </div>
} @else if (isPermissionDenied()) {
  <div class="error-message">
    <p>Camera permission denied</p>
    <p class="error-hint">Please allow camera access in your browser settings</p>
  </div>
} @else {
  <div class="no-devices-message">
    <p>No video capture devices detected</p>
  </div>
}
