<div class="storage-container">
  <div class="content-row">
    <div class="left-container">
      <lib-directory-tree-container
        [deviceId]="deviceId()"
        (directoryNavigated)="onDirectoryNavigated()"
      ></lib-directory-tree-container>
    </div>
    <div class="right-container">
      <lib-search-results [deviceId]="deviceId()" [animationTrigger]="hasActiveSearch()">
      </lib-search-results>
      <lib-play-history [deviceId]="deviceId()" [animationTrigger]="shouldShowHistory()">
      </lib-play-history>
      <lib-directory-files
        [deviceId]="deviceId()"
        [animationTrigger]="!hasActiveSearch() && !shouldShowHistory()"
      >
      </lib-directory-files>
    </div>
  </div>
</div>
