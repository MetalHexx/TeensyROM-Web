@if (device()?.isEnabled) {
<div class="device-container">
  <div class="device-header">
    <div class="swipe-container" #swipeContainer>
      <lib-file-image [deviceId]="deviceId()" [currentFile]="currentFile()"></lib-file-image>
      @if (enableVideo()) {
        <lib-video-capture [deviceId]="deviceId()"></lib-video-capture>
      }
    </div>
    @if (enableVideo()) {
      <div class="swipe-indicators phone-only">
        <span class="dot" role="button" tabindex="0" [attr.aria-label]="'Show image'" [class.active]="activePane() === 0" (click)="scrollToPane(0)" (keyup.enter)="scrollToPane(0)"></span>
        <span class="dot" role="button" tabindex="0" [attr.aria-label]="'Show video'" [class.active]="activePane() === 1" (click)="scrollToPane(1)" (keyup.enter)="scrollToPane(1)"></span>
      </div>
    }
    <lib-file-description [deviceId]="deviceId()"></lib-file-description>
  </div>
  <!-- @if (isPlayerLoaded() && fileDescription()) {
    <div class="marquee-container">
      <lib-scaling-compact-card animationEntry="from-top">
        <lib-scrolling-marquee [text]="fileDescription()" effect="random"></lib-scrolling-marquee>
      </lib-scaling-compact-card>
    </div>
  } -->
  @if (isPlayerLoaded()) {
  <div class="combined-toolbar">
    <div class="player-toolbar-wrapper">
      <lib-player-toolbar [deviceId]="deviceId()"></lib-player-toolbar>
    </div>
    <div class="filter-toolbar-wrapper">
      <lib-filter-toolbar [deviceId]="deviceId()"></lib-filter-toolbar>
    </div>
  </div>
  }
  <div class="storage-container">
    <lib-storage-container [deviceId]="deviceId()"></lib-storage-container>
  </div>
</div>
}
