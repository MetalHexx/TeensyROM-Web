@if (showCard()) {
  <lib-scaling-compact-card cardClass="glassy-card">
    <ng-container *ngTemplateOutlet="filterContent"></ng-container>
  </lib-scaling-compact-card>
} @else {
  <ng-container *ngTemplateOutlet="filterContent"></ng-container>
}

<ng-template #filterContent>
  <div class="filter-buttons">
    <lib-icon-button
      icon="all_inclusive"
      ariaLabel="Filter: Allow All Files.  Random launches and search will include all file types."
      [tooltip]="allFilterTooltip"
      size="large"
      [color]="getButtonColor(PlayerFilterType.All)"
      [disabled]="disabled()"
      (buttonClick)="onAllClick()"
      data-testid="filter-all-button"
    />

    <lib-icon-button
      ariaLabel="Filter Games/Programs Only.  Random launches and search will only include games and programs."
      [tooltip]="gamesFilterTooltip"
      size="large"
      [color]="getButtonColor(PlayerFilterType.Games)"
      [disabled]="disabled()"
      (buttonClick)="onGamesClick()"
      data-testid="filter-games-button"
    >
      <lib-joystick-icon></lib-joystick-icon>
    </lib-icon-button>

    <lib-icon-button
      icon="music_note"
      ariaLabel="Filter: Music Only. Random launches and search will only include music files."
      [tooltip]="musicFilterTooltip"
      size="large"
      [color]="getButtonColor(PlayerFilterType.Music)"
      [disabled]="disabled()"
      (buttonClick)="onMusicClick()"
      data-testid="filter-music-button"
    />

    <lib-icon-button
      ariaLabel="Filter: Images / Text files Only. Random launches and search will only include image and text files."
      [tooltip]="imagesFilterTooltip"
      size="large"
      [color]="getButtonColor(PlayerFilterType.Images)"
      [disabled]="disabled()"
      (buttonClick)="onImagesClick()"
      data-testid="filter-images-button"
    >
      <lib-image-icon></lib-image-icon>
    </lib-icon-button>

    <div class="vertical-separator" data-testid="separator"></div>

    <lib-random-roll-button
      [getButtonColor]="'normal'"
      [disabled]="disabled()"
      (buttonClick)="onRandomLaunchClick()"
      data-testid="random-launch-button"
    />
  </div>
</ng-template>
