<div class="toolbar-actions">
  <!-- Custom Timer Button with Menu -->
  <lib-icon-button
    icon="timer"
    ariaLabel="Custom Play Timer"
    size="large"
    variant="rounded-transparent"
    [color]="isCustomTimerEnabled() ? 'highlight' : 'normal'"
    [matTooltip]="'Custom Play Timer'"
    [matMenuTriggerFor]="timerMenu"
    [matBadge]="timerBadgeText()"
    matBadgePosition="above after"
    matBadgeColor="primary"
    [matBadgeHidden]="!isCustomTimerEnabled()"
    data-testid="timer-button"
  >
  </lib-icon-button>

  <mat-menu #timerMenu="matMenu">
    <!-- Off option -->
    <button mat-menu-item (click)="onTimerMenuItemClick(null)" data-testid="timer-menu-off">
      @if (!isCustomTimerEnabled()) {
        <mat-icon>check</mat-icon>
      }
      <span>Off</span>
    </button>

    <!-- Duration options -->
    @for (option of durationOptions; track option.valueMs) {
      <button mat-menu-item (click)="onTimerMenuItemClick(option.valueMs)" [attr.data-testid]="'timer-menu-' + option.label">
        @if (isCustomTimerEnabled() && selectedDurationMs() === option.valueMs) {
          <mat-icon>check</mat-icon>
        }
        <span>{{ option.label }}</span>
      </button>
    }
  </mat-menu>

  <lib-icon-button
    icon="shuffle"
    ariaLabel="Toggle Shuffle Mode"
    size="large"
    variant="rounded-transparent"
    [color]="isShuffleMode() ? 'highlight' : 'normal'"
    (buttonClick)="toggleShuffleMode()"
  >
  </lib-icon-button>
  <lib-icon-button
    data-testid="favorite-button"
    [ariaLabel]="isFavorite() ? 'Remove from Favorites' : 'Add to Favorites'"
    size="large"
    variant="rounded-transparent"
    [color]="'normal'"
    [disabled]="!currentFile() || isFavoriteOperationInProgress()"
    (buttonClick)="toggleFavorite()"
  >
    @if (isFavorite()) {
    <mat-icon>favorite</mat-icon>
    } @else {
    <mat-icon>favorite_border</mat-icon>
    }
  </lib-icon-button>
</div>
