<div class="toolbar-actions">
  <!-- Custom Timer Button with Dropdown Menu -->
  <lib-dropdown-menu #timerDropdown>
    <lib-icon-button
      icon="timer"
      [ariaLabel]="timerAriaLabel()"
      [tooltip]="timerTooltip()"
      tool
      size="large"
      variant="rounded-transparent"
      [color]="isCustomTimerEnabled() ? 'highlight' : 'normal'"
      [disabled]="disabled()"
      [matBadge]="timerBadgeText()"
      matBadgePosition="above after"
      matBadgeColor="primary"
      [matBadgeHidden]="!isCustomTimerEnabled()"
      data-testid="timer-button"
      (buttonClick)="timerDropdown.toggle()"
    >
    </lib-icon-button>

    <div dropdown-content>
      <!-- Off option -->
      <lib-dropdown-menu-item 
        [selected]="!isCustomTimerEnabled()"
        [testId]="'timer-menu-off'"
        (itemClick)="onTimerMenuItemClick(null)"
      >
        Off
      </lib-dropdown-menu-item>

      <!-- Duration options -->
      @for (option of durationOptions; track option.valueMs) {
        <lib-dropdown-menu-item
          [selected]="isCustomTimerEnabled() && selectedDurationMs() === option.valueMs"
          [testId]="'timer-menu-' + option.label"
          (itemClick)="onTimerMenuItemClick(option.valueMs)"
        >
          {{ option.label }}
        </lib-dropdown-menu-item>
      }
    </div>
  </lib-dropdown-menu>

  <lib-icon-button
    icon="history"
    ariaLabel="Toggle Play History"
    [tooltip]="historyTooltip()"
    size="large"
    variant="rounded-transparent"
    [color]="historyViewVisible() ? 'highlight' : 'normal'"
    [disabled]="disabled()"
    (buttonClick)="toggleHistory()"
  >
  </lib-icon-button>

  <lib-icon-button
    icon="shuffle"
    ariaLabel="Toggle Shuffle Mode"
    [tooltip]="shuffleTooltip()"
    size="large"
    variant="rounded-transparent"
    [color]="isShuffleMode() ? 'highlight' : 'normal'"
    [disabled]="disabled()"
    (buttonClick)="toggleShuffleMode()"
  >
  </lib-icon-button>

  <lib-icon-button
    data-testid="favorite-button"
    [ariaLabel]="isFavorite() ? 'Remove from Favorites' : 'Add to Favorites'"
    [tooltip]="favoriteTooltip()"
    size="large"
    variant="rounded-transparent"
    [color]="'normal'"
    [disabled]="disabled() || !currentFile() || isFavoriteOperationInProgress()"
    (buttonClick)="toggleFavorite()"
  >
    <mat-icon [class]="favoriteIconClass()">favorite</mat-icon>
  </lib-icon-button>
</div>
