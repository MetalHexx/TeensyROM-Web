<lib-sliding-container
  animationDirection="from-top"
  [animationTrigger]="isPlayerLoadedComputed()"
>
  <lib-scaling-compact-card animationEntry="from-top" animationParent="auto" cardClass="glassy-card">
    <lib-progress-bar
      [currentValue]="currentTime()"
      [totalValue]="totalTime()"
      [show]="showProgressBar()"
    ></lib-progress-bar>

    <div class="mini-toolbar" data-testid="player-toolbar-mini">
      <div class="time-row">
        <lib-file-time displayMode="current" [currentTime]="currentTime()" [totalTime]="totalTime()" [show]="showProgressBar()"></lib-file-time>
        <lib-file-time displayMode="total" [currentTime]="currentTime()" [totalTime]="totalTime()" [show]="showProgressBar()"></lib-file-time>
      </div>

      <div class="playback-controls">
        <lib-icon-button
          icon="skip_previous"
          ariaLabel="Previous"
          [tooltip]="previousTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigatePreviousComputed()"
          (buttonClick)="previous()"
        ></lib-icon-button>

        @if (isCurrentFileMusicTypeComputed()) {
          <lib-icon-button
            [icon]="getPlayPauseIconComputed()"
            [ariaLabel]="getPlayPauseLabelComputed()"
            [tooltip]="playPauseTooltip()"
            size="large"
            variant="rounded-primary"
            class="playback-icon-filled"
            [color]="getPlayButtonColorComputed()"
            (buttonClick)="playPause()"
          ></lib-icon-button>
        } @else {
          <lib-icon-button
            icon="stop"
            ariaLabel="Stop"
            [tooltip]="stopTooltip"
            size="large"
            variant="rounded-primary"
            class="playback-icon-filled"
            [color]="getPlayButtonColorComputed()"
            (buttonClick)="stop()"
          ></lib-icon-button>
        }

        <lib-icon-button
          icon="skip_next"
          ariaLabel="Next"
          [tooltip]="nextTooltip()"
          size="large"
          variant="rounded-transparent"
          color="normal"
          class="playback-icon-filled"
          [disabled]="!canNavigateComputed()"
          (buttonClick)="next()"
        ></lib-icon-button>
      </div>
    </div>
  </lib-scaling-compact-card>
</lib-sliding-container>
