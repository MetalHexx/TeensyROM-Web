<lib-scaling-card
  [title]="creatorName()"
  [metadataSource]="metadataSource()"
  [enableOverflow]="false"
>
  <lib-content-overlay-container [showOverlaysOnHover]="true">
    <!-- Content slot: CRT wrapper around cycling images -->
    <ng-container content>
      <lib-crt-effect-wrapper
        #crtWrapper
        [settings]="crtSettings()"
        [enabled]="isCrtEnabled()"
        [contentAspectRatio]="1">
        <div class="image-wrapper">
          <lib-cycle-image
            [images]="imageUrls()"
            [intervalMs]="8000"
            animationEntry="from-bottom-left"
            animationExit="none"
            (imageChange)="crtWrapper.refreshImage()"
          />
        </div>
      </lib-crt-effect-wrapper>
    </ng-container>

    <!-- Top left corner: CRT settings panel (rendered via CDK Overlay to prevent container clipping) -->
    @if (isCrtEnabled() && showCrtControls()) {
      <lib-crt-settings-panel-overlay
        topLeftCorner
        [settings]="crtSettings()"
        [config]="crtConfig"
        [maxHeight]="350"
        [currentPresetLabel]="currentPresetLabel()"
        [excludePresets]="excludePresets()"
        [validatePresetNameFn]="validatePresetNameFn"
        (settingsChange)="onCrtSettingsChange($event)"
        (presetSelected)="onCrtPresetSelected($event)"
        (closed)="toggleCrtControls()">
      </lib-crt-settings-panel-overlay>
    }

    <!-- Right controls toolbar -->
    <lib-video-controls-toolbar
      rightControls
      [isCrtEnabled]="isCrtEnabled()"
      [showCrtControls]="showCrtControls()"
      [isDeviceSelectorActive]="false"
      [showDeviceSelector]="false"
      [showFullscreen]="false"
      [showClose]="false"
      (crtToggleClick)="toggleCrtEffect()"
      (crtSettingsClick)="toggleCrtControls()">
    </lib-video-controls-toolbar>
  </lib-content-overlay-container>
</lib-scaling-card>
