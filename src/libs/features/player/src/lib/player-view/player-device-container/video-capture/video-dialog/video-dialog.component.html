<!-- Video dialog using composed UI components -->
<lib-content-overlay-container
  #overlayContainer
  [showOverlaysOnHover]="true"
  [overlayTransitionMs]="300"
>
  <!-- Content slot: CRT wrapper around video stream -->
  <lib-crt-effect-wrapper content
    [settings]="crtSettings()"
    [config]="crtConfig"
    [enabled]="isCrtEnabled()"
    [contentAspectRatio]="4/3"
  >
    <lib-video-stream
      [stream]="data.stream"
      [objectFit]="'contain'"
    ></lib-video-stream>
  </lib-crt-effect-wrapper>

  <!-- Top overlay: Filter toolbar -->
  <lib-filter-toolbar topOverlay
    [deviceId]="data.deviceId"
  ></lib-filter-toolbar>

  <!-- Bottom overlay: Player toolbar -->
  <lib-player-toolbar bottomOverlay
    [deviceId]="data.deviceId"
  ></lib-player-toolbar>

  <!-- Top right corner: Close button -->
  <lib-icon-button topRightCorner
    icon="close"
    ariaLabel="Close dialog"
    variant="rounded-transparent"
    (buttonClick)="onClose()"
  ></lib-icon-button>

  <!-- Left controls: CRT settings panel (slides in when showCrtControls is true) -->
  @if (isCrtEnabled()) {
    <lib-crt-settings-panel leftControls
      [settings]="crtSettings()"
      [config]="crtConfig"
      [visible]="showCrtControls()"
      [class.panel-hidden]="!showCrtControls()"
      (settingsChange)="onCrtSettingsChange($event)"
      (resetRequested)="onCrtReset()"
      (presetSelected)="onCrtPresetSelected($event)"
    ></lib-crt-settings-panel>
  }

  <!-- Right controls: CRT toggle, settings toggle, fullscreen -->
  <div rightControls class="right-controls-wrapper">
    <lib-compact-card-layout cardClass="glassy-card">
      <!-- CRT settings button (only when CRT is enabled) -->
      @if (isCrtEnabled()) {
        <lib-icon-button
          icon="tune"
          ariaLabel="CRT settings"
          variant="rounded-transparent"
          [class.active]="showCrtControls()"
          (buttonClick)="toggleCrtControls()"
        ></lib-icon-button>
      }

      <!-- CRT effect toggle button -->
      <lib-icon-button
        icon="tv"
        ariaLabel="Toggle CRT effect"
        variant="rounded-transparent"
        [class.active]="isCrtEnabled()"
        (buttonClick)="toggleCrtEffect()"
      ></lib-icon-button>

      <!-- Fullscreen toggle button -->
      <lib-icon-button
        [icon]="overlayContainer.isFullscreen() ? 'fullscreen_exit' : 'fullscreen'"
        [ariaLabel]="overlayContainer.isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
        variant="rounded-transparent"
        (buttonClick)="toggleFullscreen()"
      ></lib-icon-button>
    </lib-compact-card-layout>
  </div>
</lib-content-overlay-container>
