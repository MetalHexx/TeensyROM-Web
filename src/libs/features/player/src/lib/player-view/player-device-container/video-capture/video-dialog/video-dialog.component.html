<!-- Video dialog using composed UI components -->
<lib-content-overlay-container
  #overlayContainer
  [showOverlaysOnHover]="!isDeviceSelectorOpen()"
  [overlayTransitionMs]="300"
>
  <!-- Content slot: CRT wrapper around video stream -->
  <lib-crt-effect-wrapper content
    [settings]="crtSettings()"
    [enabled]="isCrtEnabled()"
    [contentAspectRatio]="4/3"
  >
    <lib-video-stream
      [stream]="currentStream()"
      [objectFit]="'contain'"
    ></lib-video-stream>
  </lib-crt-effect-wrapper>

  <!-- Top overlay: Filter toolbar -->
  <lib-filter-toolbar topOverlay
    [deviceId]="data.deviceId"
  ></lib-filter-toolbar>

  <!-- Bottom overlay: Player toolbar -->
  <lib-player-toolbar bottomOverlay
    [deviceId]="data.deviceId"
  ></lib-player-toolbar>

  <!-- Top left corner: Device selector (always rendered, visibility controlled by CSS) -->
  <lib-video-device-selector
    topLeftCorner
    slideDirection="left"
    [visible]="showDeviceSelector()"
    [devices]="data.devices"
    [selectedDeviceId]="selectedDeviceId()"
    (deviceSelected)="onDeviceSelected($event)"
    (openedChange)="onDeviceSelectorOpenedChange($event)">
  </lib-video-device-selector>

  <!-- Top right corner: Close button -->
  <lib-icon-button topRightCorner
    icon="close"
    ariaLabel="Close dialog"
    variant="rounded-transparent"
    (buttonClick)="onClose()"
  ></lib-icon-button>

  <!-- Left controls: CRT settings panel (always rendered when CRT enabled, visibility controlled by CSS) -->
  @if (isCrtEnabled()) {
    <lib-crt-settings-panel leftControls
      [class.panel-hidden]="!showCrtControls()"
      [settings]="crtSettings()"
      [config]="crtConfig"
      [validatePresetNameFn]="validatePresetNameFn"
      (settingsChange)="onCrtSettingsChange($event)"
      (presetSelected)="onCrtPresetSelected($event)"
      (closed)="toggleCrtControls()">
    ></lib-crt-settings-panel>
  }

  <!-- Right controls toolbar -->
  <lib-video-controls-toolbar
    rightControls
    [isCrtEnabled]="isCrtEnabled()"
    [showCrtControls]="showCrtControls()"
    [isDeviceSelectorActive]="showDeviceSelector()"
    [isFullscreen]="overlayContainer.isFullscreen()"
    [showFullscreen]="true"
    [showClose]="false"
    (crtToggleClick)="toggleCrtEffect()"
    (crtSettingsClick)="toggleCrtControls()"
    (deviceSelectorClick)="toggleDeviceSelector()"
    (fullscreenClick)="toggleFullscreen()">
  </lib-video-controls-toolbar>
</lib-content-overlay-container>
