<lib-scaling-compact-card>
  @if (store.showApplyTarget()) {
    <div class="apply-target">
      <span class="control-label" id="apply-to">Apply to</span>
      <lib-segmented-control
        [options]="targetOptions()"
        [selectedId]="store.effectiveApplyTarget()"
        accessibleName="Apply to"
        (optionSelect)="store.setApplyTarget($event)"
      />
    </div>
  }
  @if (store.connectedDevices().length === 0) {
    <lib-icon-label
      class="no-device"
      icon="usb_off"
      color="dimmed"
      label="Connect a TeensyROM to apply a theme."
      [truncate]="false"
      role="status"
    />
  }
  <div class="actions">
    <lib-action-button
      icon="check"
      label="Apply"
      variant="flat"
      color="primary"
      [fullWidth]="false"
      [disabled]="!store.canApply()"
      (buttonClick)="onApply()"
    />

    <span class="save-wrapper" [libTooltip]="saveTooltip()">
      <lib-action-button
        icon="save"
        label="Save"
        variant="stroked"
        color="normal"
        [fullWidth]="false"
        [disabled]="!store.canSave()"
        [ariaLabel]="saveAriaLabel()"
        (buttonClick)="onSave()"
      />
    </span>

    <lib-dropdown-dialog #saveAs (opened)="saveAsOpen.set(true)" (closed)="saveAsOpen.set(false)">
      <lib-action-button
        icon="save_as"
        label="Save as"
        variant="stroked"
        color="normal"
        [fullWidth]="false"
        (buttonClick)="saveAs.open()"
      />
      <div dialog-content class="glassy-card">
        @if (saveAsOpen()) {
          <lib-preset-name-dialog
            title="Save Theme As"
            fieldLabel="Theme name"
            placeholder="Enter theme name"
            inputAriaLabel="Theme name"
            saveLabel="Save theme"
            [maxLength]="maxNameLength"
            [initialValue]="suggestedName()"
            [reservedNames]="themeNames()"
            [validationFn]="validateName"
            (confirmed)="onSaveAs($event, saveAs)"
            (cancelled)="saveAs.close()"
          />
        }
      </div>
    </lib-dropdown-dialog>

    <lib-action-button
      icon="delete"
      label="Delete"
      variant="stroked"
      color="error"
      [fullWidth]="false"
      [disabled]="!store.canDelete()"
      (buttonClick)="onDelete()"
    />
  </div>
</lib-scaling-compact-card>
