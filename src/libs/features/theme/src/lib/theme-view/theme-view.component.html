<div class="theme-view">
  <lib-theme-list
    class="area-list"
    [shipped]="store.shippedThemes()"
    [custom]="store.customThemes()"
    [selectedId]="store.selectedThemeId()"
    (themeSelected)="store.selectTheme($event)"
  />
  <lib-theme-colors-card
    class="area-colors"
    [colors]="store.draft()"
    [subtitle]="subtitle()"
    [infoText]="infoText()"
    (colorChange)="onColorChange($event)"
  />
  <lib-theme-actions class="area-actions" />
</div>
