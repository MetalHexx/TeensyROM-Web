<div class="theme-view" [class.with-preview]="previewDeviceId() !== null">
  <lib-theme-list
    class="area-list"
    [shipped]="store.shippedThemes()"
    [custom]="store.customThemes()"
    [selectedId]="store.selectedThemeId()"
    (themeSelected)="store.selectTheme($event)"
  />
  <lib-theme-colors-card
    class="area-colors"
    [colors]="store.draft()"
    [subtitle]="subtitle()"
    [infoText]="infoText()"
    (colorChange)="onColorChange($event)"
  />
  @if (previewDeviceId(); as deviceId) {
    <lib-theme-preview class="area-preview" [deviceId]="deviceId" />
  }
  <lib-theme-actions class="area-actions" />
</div>
