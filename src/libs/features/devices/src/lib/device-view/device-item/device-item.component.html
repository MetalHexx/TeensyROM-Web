<lib-scaling-card
  [title]="device()?.name"
  [enableOverflow]="false"
  data-testid="device-card"
  [ngClass]="{ dimmed: !isEnabled() && !isOffline() }"
  [cardClass]="isOffline() ? 'offline' : ''"
  animationEntry="from-left"
>
  <!-- Forget button in corner slot - shown only when offline, left of the power button -->
  @if (isOffline()) {
    <lib-icon-button
      slot="corner"
      icon="delete"
      ariaLabel="Forget device"
      data-testid="device-forget-button"
      size="medium"
      [tooltip]="forgetTooltip"
      (buttonClick)="onForget()"
    >
    </lib-icon-button>
  }

  <!-- Power button in corner slot - repurposed for enable/disable, or reconnect when offline -->
  <lib-icon-button
    slot="corner"
    icon="power_settings_new"
    ariaLabel="Toggle Enabled"
    data-testid="device-power-button"
    [color]="powerColor()"
    size="medium"
    [tooltip]="powerTooltip()"
    [disabled]="reconnecting()"
    (buttonClick)="onPowerClick()"
  >
  </lib-icon-button>

  <!-- Main content -->
  <div class="device-content">
    <div class="device-info" data-testid="device-info">
      <lib-icon-label
        icon="tag"
        data-testid="device-id-label"
        [label]="'Device ID: ' + (device()?.deviceId ?? '')"
      ></lib-icon-label>
      <lib-icon-label
        icon="developer_board"
        data-testid="device-firmware-label"
        [label]="'Firmware: ' + (device()?.fwVersion ?? '')"
      ></lib-icon-label>

      <!-- Show connection info: offline takes priority, then prefer TCP details when available -->
      @if (isOffline()) {
        <lib-icon-label
          icon="cloud_off"
          data-testid="device-offline-label"
          [label]="offlineLabel()"
          color="error"
        ></lib-icon-label>
      } @else if (device()?.ipAddress) {
        <lib-icon-label
          icon="wifi"
          data-testid="device-address-label"
          [label]="(device()?.ipAddress ?? '') + (device()?.tcpPort ? ':' + device()?.tcpPort : '')"
        ></lib-icon-label>
      } @else {
        <lib-icon-label
          icon="usb"
          data-testid="device-port-label"
          [label]="'Port: ' + (device()?.comPort ?? '')"
        ></lib-icon-label>
      }

      <lib-icon-label
        icon="verified_user"
        data-testid="device-compatible-label"
        [label]="'Compatible: ' + (device()?.isCompatible ? 'Yes' : 'No')"
      ></lib-icon-label>
    </div>
    <div class="device-storage" data-testid="device-storage">
      <lib-storage-status
        icon="usb"
        label="USB Stick"
        data-testid="usb-storage-status"
        [status]="usbStatus()"
        [indexExists]="usbIndexExists()"
        [unknown]="isOffline()"
        (index)="onIndex(StorageType.Usb)"
      ></lib-storage-status>
      <lib-storage-status
        icon="sd_card"
        label="SD Card"
        data-testid="sd-storage-status"
        [status]="sdStatus()"
        [indexExists]="sdIndexExists()"
        [unknown]="isOffline()"
        (index)="onIndex(StorageType.Sd)"
      ></lib-storage-status>
    </div>
  </div>
</lib-scaling-card>
