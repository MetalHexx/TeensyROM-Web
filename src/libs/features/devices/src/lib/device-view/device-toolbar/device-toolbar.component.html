<lib-scaling-compact-card
  class="toolbar-card"
  animationEntry="from-left"
  data-testid="device-toolbar"
>
  <div class="toolbar-button-container">
    <div class="direct-connect" data-testid="device-ip-connect">
      <label for="device-ip-address">Device IP address</label>
      <div class="direct-connect-controls">
        <input
          #deviceIpAddress
          id="device-ip-address"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="192.168.1.42"
          aria-label="Device IP address"
          (keyup.enter)="onConnectByIp(deviceIpAddress.value)"
        />
        <lib-action-button
          data-testid="toolbar-button-connect-ip"
          icon="lan"
          label="Connect"
          [tooltip]="directConnectTooltip"
          (buttonClick)="onConnectByIp(deviceIpAddress.value)"
        >
        </lib-action-button>
      </div>
    </div>
    <lib-action-button
      data-testid="toolbar-button-discover-devices"
      icon="refresh"
      label="Discover Devices"
      [tooltip]="scanTooltip"
      (buttonClick)="onRefreshDevices()"
    >
    </lib-action-button>
    <lib-action-button
      data-testid="toolbar-button-reset-devices"
      icon="reset_tv"
      label="Reset Devices"
      [disabled]="!hasEnabledDevices()"
      [tooltip]="resetTooltip()"
      (buttonClick)="onResetDevices()"
    >
    </lib-action-button>
    <lib-action-button
      data-testid="toolbar-button-ping-devices"
      icon="network_ping"
      label="Ping Devices"
      [disabled]="!hasEnabledDevices()"
      [tooltip]="pingTooltip()"
      (buttonClick)="onPingDevices()"
    >
    </lib-action-button>
    <lib-action-button
      data-testid="toolbar-button-index-all"
      icon="download"
      label="Index All"
      [disabled]="!hasEnabledDevices()"
      [tooltip]="indexAllTooltip()"
      (buttonClick)="onIndexAllStorage()"
    >
    </lib-action-button>
  </div>
</lib-scaling-compact-card>
