<mat-card [ngClass]="{ dimmed: isUnavailable() }">
  <mat-card-content>
    <div class="storage-container">
      <lib-icon-label
        [icon]="icon()"
        [label]="label()"
        [secondaryLabel]="subtitle()"
        [secondaryLabelClass]="subtitleClass()"
        size="large"
      ></lib-icon-label>

      <lib-icon-button
        (click)="onIndex()"
        [disabled]="isUnavailable()"
        [attr.data-testid]="'storage-index-button-' + (icon() === 'usb' ? 'usb' : 'sd')"
        [tooltip]="tooltipMessage()"
        size="large"
        icon="download"
        ariaLabel="Index Storage"
      ></lib-icon-button>
    </div>
  </mat-card-content>
</mat-card>
