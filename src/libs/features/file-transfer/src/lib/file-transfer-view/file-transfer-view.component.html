<div class="file-transfer-view">
  <div class="transfer-main">
    @if (enabledDevices().length === 0) {
    <lib-empty-state-message
      icon="devices"
      title="No Enabled Devices"
      message="Enable a TeensyROM device to get started."
      secondaryMessage="Visit the <strong>Device View</strong> to manage your devices."
      data-testid="no-devices-empty-state"
    >
    </lib-empty-state-message>
    } @else {
    <div class="transfer-header" data-testid="transfer-header">
      <div class="transfer-header-row" data-testid="transfer-header-row">
        <lib-dropzone-card />
        <lib-transfers-card />
      </div>
      <lib-transfer-toolbar [settingsOpen]="panelOpen()" (settingsToggle)="togglePanel()" />
    </div>
    <div class="content-row" data-testid="content-row">
      <div class="left-container" data-testid="left-container">
        <lib-devices-tree-card [devices]="enabledDevices()" />
      </div>
      <div class="right-container" data-testid="right-container">
        @if (targetDevice(); as device) {
        <lib-transfer-directory-listing [deviceId]="device.deviceId" />
        }
      </div>
    </div>
    }
  </div>
  @if (panelEverOpened()) {
  <lib-sliding-container
    #panelSlot
    class="panel-slot"
    [class.panel-slot--open]="panelOpen()"
    animationDirection="from-right"
    containerWidth="22.5rem"
    containerHeight="100%"
    [animationTrigger]="panelOpen()"
    [animationDuration]="panelAnimationDuration()"
  >
    <lib-transfer-settings-panel
      [open]="panelOpen()"
      [animationDuration]="panelAnimationDuration()"
      (closePanel)="closePanel()"
    />
  </lib-sliding-container>
  }
</div>
