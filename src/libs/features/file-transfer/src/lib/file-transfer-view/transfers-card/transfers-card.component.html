<lib-sliding-container animationDirection="from-top" [animationTrigger]="true">
  <lib-scaling-compact-card animationEntry="from-top" animationParent="auto" cardClass="glassy-card">
    <div class="transfers-card" data-testid="transfers-card">
      <div class="transfers-header">
        <span>Transfers</span>
        <span class="transfers-count" data-testid="transfers-count">{{ rows().length }}</span>
      </div>

      @if (rows().length > 0) {
        <div class="transfers-list">
          @for (row of rows(); track row.transfer.jobId) {
            <lib-transfer-row
              [transfer]="row.transfer"
              [deviceName]="row.deviceName"
              [originLabel]="row.originLabel"
              [watched]="row.watched"
              [elapsedLabel]="row.elapsedLabel"
              (showRequested)="onShowRequested(row.transfer.deviceId)"
            />
          }
        </div>
      } @else {
        <p class="transfers-empty" data-testid="transfers-empty">Nothing is being sent</p>
      }

      <div class="visually-hidden" aria-live="polite" data-testid="transfers-live-region">{{ announcement() }}</div>
    </div>
  </lib-scaling-compact-card>
</lib-sliding-container>
