<div class="dj-mixer-view">
  <div
    #mixerGrid
    class="mixer-grid"
    [class.mixer-grid--two]="decks.length === 2"
    [class.mixer-grid--no-browser]="browserCollapsed()"
  >
    @for (deck of decks; track deck.index) {
    <lib-dj-deck-column [deck]="deck" [dropActive]="dragging()"></lib-dj-deck-column>
    }
    <lib-dj-sid-panel
      [decks]="decks"
      [bindingsOpen]="panelOpen()"
      [browserShown]="browserShown()"
      (bindingsToggle)="togglePanel()"
      (browserToggle)="toggleBrowser()"
    ></lib-dj-sid-panel>
    <lib-sliding-container
      class="bottom-slot"
      animationDirection="from-bottom"
      containerHeight="100%"
      [animationTrigger]="browserShown()"
      [animationDuration]="panelAnimationDuration()"
      (animationComplete)="onBandAnimationComplete()"
    >
      <div class="bottom-band">
        <lib-scaling-compact-card
          class="browse-card"
          cardClass="compact-card--fill"
          animationEntry="from-bottom"
        >
          <lib-dj-browse-trees
            [devices]="enabledDevices()"
            [sets]="setsBranch()"
            [activeStorage]="activeStorage()"
            (storageSelect)="onStorageSelect($event)"
            (setSelect)="onSetSelect($event)"
          ></lib-dj-browse-trees>
        </lib-scaling-compact-card>
        @if (enabledDevices().length === 0) {

        <lib-empty-state-message
          icon="devices"
          title="No Enabled Devices"
          message="Enable a TeensyROM device to get started."
          secondaryMessage="Visit the <strong>Device View</strong> to manage your devices."
        >
        </lib-empty-state-message>

        } @else {

        <lib-scaling-compact-card
          class="directory-listing-card"
          cardClass="compact-card--fill"
          animationEntry="from-bottom"
        >
          <lib-dj-directory-listing
            [activeStorage]="activeStorage()"
            (dragStarted)="dragging.set(true)"
            (dragEnded)="dragging.set(false)"
          ></lib-dj-directory-listing>
        </lib-scaling-compact-card>

        }
        <lib-scaling-compact-card
          class="set-card"
          cardClass="compact-card--fill"
          animationEntry="from-bottom"
        >
          <lib-dj-set-card [listingDragActive]="dragging()"></lib-dj-set-card>
        </lib-scaling-compact-card>
      </div>
    </lib-sliding-container>
    @if (peekEverShown()) {
    <div class="set-peek">
      <lib-sliding-container
        animationDirection="from-bottom"
        containerHeight="100%"
        [animationTrigger]="peekShown()"
        [animationDuration]="panelAnimationDuration()"
      >
        <div class="set-peek-card">
          <lib-dj-set-card></lib-dj-set-card>
        </div>
      </lib-sliding-container>
    </div>
    }
    <span class="hidden-save-notice" role="status">{{ hiddenSaveNotice() }}</span>
    @if (mappingMode()) {
    <lib-mapping-overlay-layer
      [targets]="overlayTargets()"
      [scope]="mixerGrid"
      (targetSelect)="onTargetSelect($event)"
      (dismiss)="onOverlayDismiss()"
    ></lib-mapping-overlay-layer>
    }
  </div>
  @if (panelEverOpened()) {
  <lib-sliding-container
    #panelSlot
    class="panel-slot"
    [class.panel-slot--open]="panelOpen()"
    animationDirection="from-right"
    containerWidth="22.5rem"
    containerHeight="100%"
    [animationTrigger]="panelOpen()"
    [animationDuration]="panelAnimationDuration()"
  >
    <lib-dj-bindings-panel
      [animationDuration]="panelAnimationDuration()"
      (closePanel)="closePanel()"
    ></lib-dj-bindings-panel>
  </lib-sliding-container>
  }
</div>
