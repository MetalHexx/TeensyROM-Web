<div class="dj-mixer-view">
  @if (decks().length === 0) {

  <lib-empty-state-message
    icon="devices"
    title="No Enabled Devices"
    message="Enable a TeensyROM device to get started."
    secondaryMessage="Visit the <strong>Device View</strong> to manage your devices."
  >
  </lib-empty-state-message>

  } @else {

  <div
    class="mixer-grid"
    [class.mixer-grid--one]="decks().length === 1"
    [class.mixer-grid--two]="decks().length === 2"
    [class.mixer-grid--many]="isMany()"
    [style.grid-template-areas]="isMany() ? manyGridAreas() : null"
  >
    @for (deck of decks(); track deck.index) {
    <lib-dj-deck-column
      [deck]="deck"
      [dropActive]="dragging()"
      (fileDropped)="onFileDropped($event)"
    ></lib-dj-deck-column>
    }
    <lib-dj-mixer-card
      [decks]="decks()"
      [showCrossfader]="showCrossfader()"
      [band]="isMany()"
    ></lib-dj-mixer-card>
    <div class="bottom-band">
      <lib-scaling-compact-card
        class="browse-card"
        cardClass="compact-card--fill"
        animationEntry="from-bottom"
      >
        <lib-dj-browse-trees
          [devices]="enabledDevices()"
          [activeStorage]="activeStorage()"
          (storageSelect)="onStorageSelect($event)"
        ></lib-dj-browse-trees>
      </lib-scaling-compact-card>
      <lib-scaling-compact-card
        class="directory-listing-card"
        cardClass="compact-card--fill"
        animationEntry="from-bottom"
      >
        <lib-dj-directory-listing
          [activeStorage]="activeStorage()"
          (dragStarted)="dragging.set(true)"
          (dragEnded)="dragging.set(false)"
        ></lib-dj-directory-listing>
      </lib-scaling-compact-card>
    </div>
  </div>

  }
</div>
