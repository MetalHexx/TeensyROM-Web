<lib-scaling-compact-card cardClass="compact-card--fill" animationEntry="from-bottom">
  <div class="mixer-body">
    <div #bindingsRow class="bindings-row">
      <lib-icon-button
        icon="tune"
        [color]="bindingsOpen() ? 'highlight' : 'normal'"
        [ariaLabel]="bindingsOpen() ? 'Close bindings panel' : 'Open bindings panel'"
        [ariaExpanded]="bindingsOpen()"
        (buttonClick)="bindingsToggle.emit()"
      ></lib-icon-button>
    </div>
    <div class="key-notation" role="group" aria-label="Key notation">
      @for (option of keyFormatOptions; track option.format) {
      <button
        type="button"
        class="key-notation-option"
        [class.key-notation-option--engaged]="keyDisplayFormat() === option.format"
        [attr.aria-pressed]="keyDisplayFormat() === option.format"
        (click)="onKeyFormatSelect(option.format)"
      >
        {{ option.label }}
      </button>
      }
    </div>
    <div class="key-knobs">
      @for (key of keys(); track key.deck.index) {
      <div [attr.data-deck]="key.deck.letter">
        <lib-rotary-knob
          data-control="key"
          label="Key"
          size="medium"
          [accessibleName]="'Key deck ' + key.deck.letter"
          [value]="key.value"
          [min]="keyRange.min"
          [max]="keyRange.max"
          [step]="keyRange.step"
          [home]="keyRange.home"
          [readout]="key.readout"
          [disabled]="key.disabled"
          (valueChange)="onKeyChange(key.deck.slot, $event)"
        ></lib-rotary-knob>
      </div>
      }
    </div>
  </div>
</lib-scaling-compact-card>
