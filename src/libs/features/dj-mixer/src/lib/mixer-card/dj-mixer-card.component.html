<lib-scaling-compact-card cardClass="compact-card--fill" animationEntry="from-bottom">
  <div class="mixer-body">
    <div #bindingsRow class="bindings-row">
      <lib-icon-button
        icon="tune"
        [color]="bindingsOpen() ? 'highlight' : 'normal'"
        [ariaLabel]="bindingsOpen() ? 'Close bindings panel' : 'Open bindings panel'"
        [ariaExpanded]="bindingsOpen()"
        (buttonClick)="bindingsToggle.emit()"
      ></lib-icon-button>
    </div>
    <div class="strips" [style.--strip-count]="decks().length">
      @for (strip of strips(); track strip.deck.index; let first = $first) {
      <lib-deck-strip
        [attr.data-deck]="strip.deck.letter"
        [model]="strip.model"
        size="medium"
        [faderLength]="faderLength()"
        (knobChange)="onKnobChange(strip.deck.slot, $event)"
        (faderChange)="onFaderChange(strip.deck.slot, $event)"
      >
        <div deckStripAfterKnobs class="key-notation-slot">
          @if (first) {
          <div class="key-notation" role="group" aria-label="Key notation">
            @for (option of keyFormatOptions; track option.format) {
            <button
              type="button"
              class="key-notation-option"
              [class.key-notation-option--engaged]="keyDisplayFormat() === option.format"
              [attr.aria-pressed]="keyDisplayFormat() === option.format"
              (click)="onKeyFormatSelect(option.format)"
            >
              {{ option.label }}
            </button>
            }
          </div>
          }
        </div>
      </lib-deck-strip>
      }
    </div>
    @if (showCrossfader()) {
    <lib-crossfader
      data-control="crossfader"
      [value]="crossfader()"
      startLabel=""
      endLabel=""
      [accessibleName]="crossfaderName()"
      [trackLength]="faderLength()"
      (valueChange)="onCrossfaderChange($event)"
    ></lib-crossfader>
    }
  </div>
</lib-scaling-compact-card>
