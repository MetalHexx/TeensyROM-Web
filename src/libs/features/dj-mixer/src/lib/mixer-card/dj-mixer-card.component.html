<lib-scaling-compact-card cardClass="compact-card--fill" animationEntry="from-bottom">
  <div class="mixer-body">
    <div class="strips">
      @for (strip of strips(); track strip.deck.index) {
      <lib-deck-strip
        [model]="strip.model"
        size="medium"
        [faderLength]="faderLength()"
        (knobChange)="onKnobChange(strip.deck.slot, $event)"
        (faderChange)="onFaderChange(strip.deck.slot, $event)"
        (filterModeSelect)="onFilterModeSelect(strip.deck.slot, $event)"
      ></lib-deck-strip>
      }
    </div>
    @if (showCrossfader()) {
    <lib-crossfader
      [value]="crossfader()"
      startLabel=""
      endLabel=""
      [accessibleName]="crossfaderName()"
      [trackLength]="faderLength()"
      (valueChange)="onCrossfaderChange($event)"
    ></lib-crossfader>
    }
    <div class="key-notation" role="group" aria-label="Key notation">
      @for (option of keyFormatOptions; track option.format) {
      <button
        type="button"
        class="key-notation-option"
        [class.key-notation-option--engaged]="keyDisplayFormat() === option.format"
        [attr.aria-pressed]="keyDisplayFormat() === option.format"
        (click)="onKeyFormatSelect(option.format)"
      >
        {{ option.label }}
      </button>
      }
    </div>
  </div>
</lib-scaling-compact-card>
