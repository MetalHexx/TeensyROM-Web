<div class="deck-stack" [style.gridArea]="'d' + deck().index">
  <div class="transport-slot">
    <lib-scaling-container animationEntry="from-bottom">
      <lib-deck-transport
        [model]="transportModel()"
        (playPauseClick)="onPlayPauseClick()"
        (stopClick)="onStopClick()"
        (repeatTrackChange)="onRepeatTrackChange($event)"
        (previousSubtune)="onPreviousSubtune()"
        (nextSubtune)="onNextSubtune()"
        (previousInSet)="onPreviousInSet()"
        (nextInSet)="onNextInSet()"
        (scrubInput)="onScrubInput($event)"
        (scrubCommit)="onScrubCommit($event)"
      ></lib-deck-transport>
    </lib-scaling-container>

    @if (dropActive()) {
    <div
      class="drop-overlay"
      [class.drop-overlay--hot]="hot()"
      aria-hidden="true"
      (dragenter)="onOverlayDragEnter($event)"
      (dragover)="onOverlayDragOver($event)"
      (dragleave)="onOverlayDragLeave($event)"
      (drop)="onOverlayDrop($event)"
    >
      <span class="drop-overlay-label">Drop to load — Deck {{ deck().letter }}</span>
    </div>
    }
  </div>

  <lib-scaling-container class="loops-slot" animationEntry="from-bottom">
    <lib-loops-cues-plate
      [model]="plateModel()"
      [startDragOffset]="startDragOffset()"
      [endDragOffset]="endDragOffset()"
      (addMarker)="onAddMarker()"
      (stopLoop)="onStopLoop()"
      (toggleSelected)="onToggleSelected()"
      (playNowSelected)="onPlayNowSelected()"
      (toggleGlobal)="onToggleGlobal()"
      (setEnd)="onSetEnd()"
      (clearEnd)="onClearEnd()"
      (deleteSelected)="onDeleteSelected()"
      (rename)="onRenameSelected($event)"
      (triggerTile)="onTriggerTile($event)"
      (playNowTile)="onPlayNowTile($event)"
      (selectTile)="onSelectTile($event)"
      (nudgeInput)="onNudgeInput($event)"
      (nudgeCommit)="onNudgeCommit($event)"
      (snap)="onSnap($event)"
    ></lib-loops-cues-plate>
  </lib-scaling-container>

  <lib-scaling-container class="binding-slot" animationEntry="from-bottom">
    <lib-binding-plate
      [model]="bindingModel()"
      (portSelect)="onPortSelect($event)"
      (enableMidi)="onEnableMidi()"
      (identify)="onIdentify()"
    ></lib-binding-plate>
  </lib-scaling-container>
</div>

<div class="voice-speed-column" [style.gridArea]="'vs' + deck().index">
  <lib-scaling-container class="channel-slot" animationEntry="from-bottom">
    <lib-deck-channel-strip
      [model]="channelModel()"
      (mutedChange)="onVoiceMutedChange($event)"
      (heldChange)="onVoiceHeldChange($event)"
      (faderChange)="onSpeedChange($event)"
      (nudgeChange)="onNudgeChange($event)"
      (jump)="onSpeedJump($event)"
    ></lib-deck-channel-strip>
  </lib-scaling-container>
</div>
