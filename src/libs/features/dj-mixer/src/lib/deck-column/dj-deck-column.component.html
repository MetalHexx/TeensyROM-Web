<div class="deck-stack" [style.gridArea]="'d' + deck().index">
  <div class="transport-slot">
    <lib-scaling-compact-card animationEntry="from-bottom">
      <lib-transport-panel
        [model]="models().transport"
        [positionPercent]="models().positionPercent"
        [frameLabel]="models().frameLabel"
      ></lib-transport-panel>
    </lib-scaling-compact-card>

    @if (dropActive()) {
    <div
      class="drop-overlay"
      [class.drop-overlay--hot]="hot()"
      aria-hidden="true"
      (dragenter)="onOverlayDragEnter($event)"
      (dragover)="onOverlayDragOver($event)"
      (dragleave)="onOverlayDragLeave($event)"
      (drop)="onOverlayDrop($event)"
    >
      <span class="drop-overlay-label">Drop to load — Deck {{ deck().letter }}</span>
    </div>
    }
  </div>

  <lib-scaling-compact-card
    class="loops-card"
    cardClass="compact-card--fill"
    animationEntry="from-bottom"
  >
    <lib-loops-cues-panel [model]="models().loopsCues"></lib-loops-cues-panel>
  </lib-scaling-compact-card>

  <lib-scaling-compact-card class="binding-card-slot" animationEntry="from-bottom">
    <lib-binding-card [model]="models().binding" layout="inline"></lib-binding-card>
  </lib-scaling-compact-card>
</div>

<div class="voice-speed-column" [style.gridArea]="'vs' + deck().index">
  <lib-scaling-compact-card class="voice-card" animationEntry="from-bottom">
    <lib-voice-panel [model]="models().voice"></lib-voice-panel>
  </lib-scaling-compact-card>
  <lib-scaling-compact-card
    class="speed-card"
    cardClass="compact-card--fill"
    animationEntry="from-bottom"
  >
    <lib-speed-panel [model]="models().speed"></lib-speed-panel>
  </lib-scaling-compact-card>
</div>
