<lib-scaling-card title="Video Settings" [animationTrigger]="animationTrigger()">
  <form [formGroup]="formGroup()">
    <lib-settings-toggle-item
      label="Enable Video Overlay"
      description="Enabled enhanced video integration features with UI control overlays for an immersive experience.
      Requires a video capture device connected to your C64 video output."
      [control]="formGroup().controls['enableVideo']" />
  </form>
</lib-scaling-card>
