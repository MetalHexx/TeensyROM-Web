<div class="settings-toggle-item">
  <mat-slide-toggle 
    [formControl]="formControl"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || label()">
    <span class="toggle-label">{{ label() }}</span>
  </mat-slide-toggle>
  <p class="toggle-description">
    {{ description() }}
  </p>
</div>
