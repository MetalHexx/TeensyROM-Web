<lib-scaling-card title="Player Settings" [animationTrigger]="animationTrigger()">
  <form [formGroup]="formGroup()">
    <!-- Startup Filter Dropdown -->
    <h3 class="filter-title">Default Filter</h3>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Startup Filter</mat-label>
      <mat-select formControlName="startupFilter">
        @for (option of startupFilterOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
      @if (formGroup().get('startupFilter')?.hasError('required') && formGroup().get('startupFilter')?.touched) {
        <mat-error>Startup filter is required</mat-error>
      }
    </mat-form-field>

    <!-- Responsive Grid for Groups -->
    <div class="settings-grid">
      <!-- Playback Settings Group -->
      <div class="settings-group">
        <h3 class="group-title">Playback Behavior</h3>

        <lib-settings-toggle-item
          label="Enable repeat mode on startup"
          description="Automatically enable music repeat mode on startup.  Useful for DJ mixing."
          [control]="formGroup().controls['repeatModeOnStartup']" />

        <lib-settings-toggle-item
          label="Enable play timer on startup"
          description="Display elapsed playback time in the player interface"
          [control]="formGroup().controls['playTimerEnabled']" />

        <lib-settings-toggle-item
          label="Mute on fast forward"
          description="Mute voices when fast-forwarding through SIDs."
          [control]="formGroup().controls['muteFastForward']" />

        <lib-settings-toggle-item
          label="Mute on random seek"
          description="Mute voices when random seeking."
          [control]="formGroup().controls['muteRandomSeek']" />
      </div>

      <!-- Startup Launch Settings Group -->
      <div class="settings-group">
        <h3 class="group-title">Startup Launch</h3>

        <lib-settings-toggle-item
          label="Launch file on startup"
          description="Automatically launch a file when the application startup.  Defaults to last played file."
          [control]="formGroup().controls['startupLaunchEnabled']" />

        <lib-settings-toggle-item
          label="Launch random file"
          description="Choose a random file to launch.  Overrides the last played file default."
          [control]="formGroup().controls['startupLaunchRandom']" />
      </div>
    </div>
  </form>
</lib-scaling-card>
