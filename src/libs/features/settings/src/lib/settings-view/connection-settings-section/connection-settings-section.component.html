<lib-scaling-card title="Connection Settings" [animationTrigger]="animationTrigger()">
  <form [formGroup]="formGroup()">
    <!-- Connection Type Radio Group -->
    <div class="form-field">
      <h3 class="group-title">Connection Type</h3>
      <mat-radio-group formControlName="connectionType" class="connection-type-group">
        <mat-radio-button value="Serial">Serial</mat-radio-button>
        <mat-radio-button value="Tcp">TCP/Ethernet</mat-radio-button>
      </mat-radio-group>
      @if (formGroup().get('connectionType')?.hasError('required') && formGroup().get('connectionType')?.touched) {
        <mat-error>Connection type is required</mat-error>
      }
    </div>

    <!-- Auto-Connect Toggle -->
    <lib-settings-toggle-item
      label="Auto-connect on startup"
      description="Automatically connect to available TeensyROM devices when the API (not UI) starts."
      [control]="formGroup().controls['autoConnectEnabled']" />
  </form>
</lib-scaling-card>
