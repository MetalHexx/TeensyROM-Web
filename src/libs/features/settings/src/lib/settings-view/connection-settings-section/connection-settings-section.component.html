<lib-scaling-card title="Connection Settings">
  <form [formGroup]="formGroup()">
    <!-- Connection Type Radio Group -->
    <div class="form-field">
      <h4 class="form-label">Connection Type</h4>
      <mat-radio-group formControlName="connectionType" class="connection-type-group">
        <mat-radio-button value="Serial">Serial</mat-radio-button>
        <mat-radio-button value="Tcp">TCP/Ethernet</mat-radio-button>
      </mat-radio-group>
      @if (formGroup().get('connectionType')?.hasError('required') && formGroup().get('connectionType')?.touched) {
        <mat-error>Connection type is required</mat-error>
      }
    </div>

    <!-- Auto-Connect Toggle -->
    <div class="toggle-row">
      <mat-slide-toggle formControlName="autoConnectEnabled">
        <span class="toggle-label">Auto-connect on startup</span>
      </mat-slide-toggle>
      <p class="toggle-description">
        Automatically connect to the last known device when the application starts
      </p>
    </div>
  </form>
</lib-scaling-card>
