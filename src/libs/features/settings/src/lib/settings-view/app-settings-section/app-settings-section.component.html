<lib-scaling-card title="Application Settings">
  <form [formGroup]="formGroup()">
    <lib-settings-toggle-item
      label="Initial setup completed"
      description="Indicates whether the first-time setup wizard has been completed. Disabling this will show the setup wizard again on next application start."
      [control]="formGroup().controls['setupCompleted']" />
  </form>
</lib-scaling-card>
