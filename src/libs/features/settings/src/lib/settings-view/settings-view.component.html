@if (isLoading()) {
  <div class="loading-state">
    <div class="loading-content">
      <span class="material-icons loading-icon">settings</span>
      <p>Loading settings...</p>
    </div>
  </div>
} @else if (error()) {
  <div class="error-state">
    <div class="error-content">
      <span class="material-icons error-icon">error</span>
      <h3>Error Loading Settings</h3>
      <p>{{ error() }}</p>
    </div>
  </div>
} @else if (settingsForm()) {
  <div class="settings-container">
    <!-- Settings Form -->
    <form [formGroup]="settingsForm()!" class="settings-form">
      <mat-tab-group class="settings-tabs" animationDuration="200ms">

        <!-- Player Tab -->
        <mat-tab>
          <ng-template mat-tab-label>
            <lib-icon-label icon="play_circle" label="Player" />
          </ng-template>
          <div class="tab-content">
            <lib-player-settings-section
              [formGroup]="getPlayerSettings()" />
          </div>
        </mat-tab>

        <!-- File Transfer Tab -->
        <mat-tab>
          <ng-template mat-tab-label>
            <lib-icon-label icon="folder" label="File Transfer" />
          </ng-template>
          <div class="tab-content">
            <lib-file-transfer-settings-section
              [formGroup]="getFileTransferSettings()" />
          </div>
        </mat-tab>

        <!-- Search Tab -->
        <mat-tab>
          <ng-template mat-tab-label>
            <lib-icon-label icon="search" label="Search / Indexing" />
          </ng-template>
          <div class="tab-content">
            <lib-search-settings-section
              [formGroup]="getSearchSettings()" />
          </div>
        </mat-tab>

        <!-- App Tab -->
        <!-- <mat-tab>
          <ng-template mat-tab-label>
            <lib-icon-label icon="apps" label="App" />
          </ng-template>
          <div class="tab-content">
            <lib-app-settings-section
              [formGroup]="getAppSettings()" />
          </div>
        </mat-tab> -->

         <!-- Connection Tab -->
        <mat-tab>
          <ng-template mat-tab-label>
            <lib-icon-label icon="settings_ethernet" label="Connection" />
          </ng-template>
          <div class="tab-content">
            <lib-connection-settings-section
              [formGroup]="getConnectionSettings()" />
          </div>
        </mat-tab>
      </mat-tab-group>
    </form>

    <!-- Toolbar -->
    <div class="settings-toolbar">
      <div class="toolbar-left">
        <!-- <h2>Settings</h2> -->
      </div>
      
      <div class="toolbar-actions">
        <!-- Saving indicator -->
        <lib-loading-text
          [visible]="showSaving()"
          [text]="'Saving...'"
        />

        <!-- Action buttons -->
        <lib-scaling-compact-card class="toolbar-card">
          <div class="toolbar-button-container">
            <!-- Auto-save toggle -->
            <mat-slide-toggle
              [checked]="autoSaveEnabled()"
              (change)="autoSaveEnabled.set($event.checked)"
              color="primary">
              Auto-save
            </mat-slide-toggle>

            <!-- Save button -->
            <lib-action-button
              icon="save"
              label="Save"
              [disabled]="!canSave()"
              (buttonClick)="saveSettings()"
            >
            </lib-action-button>

            <!-- Undo button -->
            <lib-action-button
              icon="undo"
              label="Undo"
              [disabled]="!canUndo()"
              (buttonClick)="undo()"
            >
            </lib-action-button>

            <!-- Redo button -->
            <lib-action-button
              icon="redo"
              label="Redo"
              [disabled]="!canRedo()"
              (buttonClick)="redo()"
            >
            </lib-action-button>
          </div>
        </lib-scaling-compact-card>
      </div>
    </div>
  </div>
} @else {
  <div class="empty-state">
    <div class="empty-content">
      <span class="material-icons empty-icon">settings</span>
      <p>No settings available</p>
    </div>
  </div>
}
