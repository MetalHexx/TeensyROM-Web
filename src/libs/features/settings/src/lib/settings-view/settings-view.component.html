@if (error()) {

<lib-empty-state-message
  icon="error"
  title="Error Loading Settings"
  [message]="error() || ''">
</lib-empty-state-message>

} @else if (settingsForm()) {
  <div class="settings-wrapper">
    <div class="settings-container">
    <!-- Navigation Card -->
    <lib-scaling-compact-card class="navigation-card">
      <div class="navigation-buttons">
        <lib-action-button
          icon="play_circle"
          label="Player"
          ariaLabel="Navigate to player settings"
          [tooltip]="playerNavigateTooltip"
          [color]="activeSection() === 'player' ? 'highlight' : 'normal'"
          (buttonClick)="setActiveSection('player')" />
        <lib-action-button
          icon="devices"
          label="Devices"
          ariaLabel="Navigate to device settings"
          [tooltip]="devicesNavigateTooltip"
          [color]="activeSection() === 'devices' ? 'highlight' : 'normal'"
          (buttonClick)="setActiveSection('devices')" />
        <lib-action-button
          icon="folder"
          label="File Transfer"
          ariaLabel="Navigate to file transfer settings"
          [tooltip]="fileTransferNavigateTooltip"
          [color]="activeSection() === 'fileTransfer' ? 'highlight' : 'normal'"
          (buttonClick)="setActiveSection('fileTransfer')" />
        <lib-action-button
          icon="search"
          label="Search"
          ariaLabel="Navigate to search settings"
          [tooltip]="searchNavigateTooltip"
          [color]="activeSection() === 'search' ? 'highlight' : 'normal'"
          (buttonClick)="setActiveSection('search')" />
      </div>
    </lib-scaling-compact-card>

    <!-- Settings Form -->
    <form [formGroup]="settingsForm()!" class="settings-form">
      <div class="section-content">
        <!-- @if (activeSection() === 'player') { -->
          <lib-player-settings-section
            [formGroup]="getPlayerSettings()"
            [animationTrigger]="activeSection() === 'player'" />
        <!-- } -->

        <lib-device-settings-section
          [knownDevicesArray]="getKnownDevices()"
          [animationTrigger]="activeSection() === 'devices'" />

        <lib-file-transfer-settings-section
          [formGroup]="getFileTransferSettings()"
          [animationTrigger]="activeSection() === 'fileTransfer'" />

        <lib-search-settings-section
          [formGroup]="getSearchSettings()"
          [animationTrigger]="activeSection() === 'search'" />
      </div>
    </form>

    <!-- Toolbar -->
    <div class="settings-toolbar">
      <div class="toolbar-left">
        <!-- <h2>Settings</h2> -->
      </div>
      
      <div class="toolbar-actions">
        <!-- Saving indicator -->
        <lib-loading-text
          [visible]="showSaving()"
          [text]="'Saving...'"
        />

        <!-- Action buttons -->
        <lib-scaling-compact-card class="toolbar-card">
          <div class="toolbar-button-container">
            <!-- Auto-save toggle -->
            <mat-slide-toggle
              [checked]="autoSaveEnabled()"
              (change)="autoSaveEnabled.set($event.checked)"
              color="primary">
              Auto-save
            </mat-slide-toggle>

            <!-- Save button -->
            <lib-action-button
              icon="save"
              label="Save"
              ariaLabel="Save all changes"
              [tooltip]="saveTooltip"
              [disabled]="!canSave()"
              (buttonClick)="saveSettings()"
            >
            </lib-action-button>

            <!-- Undo button -->
            <lib-action-button
              icon="undo"
              label="Undo"
              ariaLabel="Undo the last saved change"
              [tooltip]="undoTooltip"
              [disabled]="!canUndo()"
              (buttonClick)="undo()"
            >
            </lib-action-button>

            <!-- Redo button -->
            <lib-action-button
              icon="redo"
              label="Redo"
              ariaLabel="Redo the last undone change"
              [tooltip]="redoTooltip"
              [disabled]="!canRedo()"
              (buttonClick)="redo()"
            >
            </lib-action-button>
          </div>
        </lib-scaling-compact-card>
      </div>
    </div>
    </div>
  </div>
}
