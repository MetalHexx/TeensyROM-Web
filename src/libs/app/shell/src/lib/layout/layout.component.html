<lib-header></lib-header>

<div class="layout-container">
  <lib-nav-rail
    class="desktop-nav"
    [items]="menuItems"
    [activeRoute]="activeRoute()"
    [hoverDelayMs]="600"
    (itemClick)="onNavItemClick($event)"
  ></lib-nav-rail>

  <div class="router-container">
    <div class="router-content">
      <router-outlet />
    </div>
  </div>
</div>

<lib-bottom-bar
  class="phone-nav"
  [items]="menuItems"
  [activeRoute]="activeRoute()"
  (itemClick)="onNavItemClick($event)"
/>

<lib-alert-container></lib-alert-container>
