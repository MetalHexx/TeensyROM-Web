<mat-toolbar class="mat-elevation-z6+" color="primary">
  <lib-nav-button></lib-nav-button>

  <span class="app-title">TeensyROM</span>
  <span class="spacer"></span>

  <!-- Version Display -->
  <span class="version-text">{{ appVersion() }}</span>

  <!-- Dark/Light Toggle -->
  <lib-icon-button
    [icon]="themeIcon()"
    ariaLabel="Toggle dark/light theme"
    [tooltip]="themeToggleTooltip"
    (buttonClick)="themeService.toggleTheme()"
  ></lib-icon-button>

  <!-- Tooltip Toggle -->
  <lib-icon-button
    icon="question_mark"
    ariaLabel="Toggle tooltips"
    [tooltip]="tooltipToggleTooltip"
    [color]="tooltipsEnabled() ? 'normal' : 'dimmed-light'"
    (buttonClick)="preferencesService.toggleTooltips()"
  ></lib-icon-button>
</mat-toolbar>
