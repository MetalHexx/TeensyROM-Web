<section class="panel tune-index-panel" aria-label="Tune Index">
  <h2>Tune Index</h2>

  <div class="tune-index-rows">
    <div class="tune-index-row">
      <span class="tune-index-label">Length</span>
      <span class="tune-index-value">{{ lengthLabel() }}</span>
    </div>
    <div class="tune-index-row">
      <span class="tune-index-label">Loop start</span>
      <span class="tune-index-value">{{ loopStartLabel() }}</span>
    </div>
    <div class="tune-index-row">
      <span class="tune-index-label">Loop period</span>
      <span class="tune-index-value">{{ loopPeriodLabel() }}</span>
    </div>
    @if (loopImplausible()) {
    <p class="tune-index-implausible" role="note">
      Short repeat — likely an ostinato or idle cycle, not the tune's loop
    </p>
    }
    <div class="tune-index-row">
      <span class="tune-index-label">Key</span>
      <span class="tune-index-value">{{ keyLabel() }}</span>
    </div>
    <div class="tune-index-row">
      <span class="tune-index-label">Key confidence</span>
      <span class="tune-index-value">{{ keyConfidenceLabel() }}</span>
    </div>
  </div>

  <label class="tune-index-loop">
    <input
      type="checkbox"
      aria-label="Loop whole tune"
      [checked]="tuneLoopArmed()"
      [disabled]="!canLoop()"
      (change)="onLoopToggle($event)"
    />
    Loop whole tune
  </label>

  <label class="tune-index-timing">
    Timing
    <select
      aria-label="Timing mode"
      [disabled]="timingMode() === null"
      (change)="onTimingModeChange($event)"
    >
      <option value="exact" [selected]="timingMode() === 'exact'">Exact</option>
      <option value="rounded" [selected]="timingMode() === 'rounded'">Rounded</option>
    </select>
  </label>
</section>
