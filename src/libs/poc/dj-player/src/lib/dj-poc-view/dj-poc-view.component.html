<div class="dj-poc-page">
  <h1 class="page-heading">ASID DJ Player (spike)</h1>

  <div
    class="grid"
    [style.gridTemplateColumns]="gridLayout.columns"
    [style.gridTemplateRows]="gridLayout.rows"
    [style.gridTemplateAreas]="gridLayout.areas"
  >
    @for (entry of gridLayout.entries; track entry.deck.id) {
    <lib-deck-host [deck]="entry.deck" [areas]="entry.areas" />
    }

    <lib-mixer-column />
  </div>

  <lib-drawer title="SETUP & DIAGNOSTICS">
    <lib-setup-drawer />
  </lib-drawer>

  <lib-drawer title="TRACK ANALYSIS">
    @if (decks().length > 0) {
    <label class="control track-analysis-deck-select">
      Deck
      <select aria-label="Track Analysis deck" (change)="onTrackAnalysisDeckChange($event)">
        @for (deck of decks(); track deck.descriptor.id) {
        <option
          [value]="deck.descriptor.id"
          [selected]="deck.descriptor.id === selectedTrackAnalysisDeckId()"
        >
          Deck {{ deck.descriptor.label }}
        </option>
        }
      </select>
    </label>
    } @if (selectedTrackAnalysisDeck(); as deck) {
    <lib-track-analysis-panel [deck]="deck" />
    }
  </lib-drawer>
</div>
