<div class="scale-knob">
  <div class="scale-knob-dial">
    <input
      type="range"
      class="scale-knob-range"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="value()"
      [attr.aria-label]="accessibleName()"
      [attr.aria-valuetext]="valueText()"
      (input)="onRangeInput($event)"
      (dblclick)="onDoubleClick()"
    />
    <svg viewBox="0 0 80 80" aria-hidden="true">
      <path class="ring-track" d="M 15.96,64.04 A 34,34 0 1,1 64.04,64.04" />
      @if (valueRingPath(); as ringPath) {
      <path class="value-ring" [attr.d]="ringPath" />
      }
      <circle class="body" cx="40" cy="40" r="26" />
      <line class="end-tick" x1="18.8" y1="61.2" x2="13.1" y2="66.9" />
      <line class="end-tick" x1="61.2" y1="61.2" x2="66.9" y2="66.9" />
      <line class="home-tick" x1="40" y1="10" x2="40" y2="2" />
      <line class="pointer" x1="40" y1="40" [attr.x2]="pointerEnd().x" [attr.y2]="pointerEnd().y" />
      <circle class="hub" cx="40" cy="40" r="4" />
    </svg>
  </div>
  @if (readout(); as readoutText) {
  <span class="scale-knob-readout">{{ readoutText }}</span>
  }
  <span class="scale-knob-label">{{ label() }}</span>
</div>
