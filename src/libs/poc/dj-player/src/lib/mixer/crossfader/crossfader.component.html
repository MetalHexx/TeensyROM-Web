<div class="crossfader">
  <span class="crossfader-label">{{ labelA }}</span>
  <input
    type="range"
    min="-1"
    max="1"
    step="0.01"
    [value]="position()"
    (input)="onPositionInput($event)"
    aria-label="Crossfader, deck A to deck B"
  />
  <span class="crossfader-label">{{ labelB }}</span>
</div>
