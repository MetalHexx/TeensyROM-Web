<lib-synth-panel class="plate">
  <section class="loops" [attr.aria-label]="model().accessibleName">
    <div class="header">
      <span class="caption" aria-hidden="true">Loops / Cues</span>
      <div class="keys">
        <lib-synth-key
          data-control="loop-add"
          label="Add"
          icon="add"
          [accessibleName]="model().addAccessibleName"
          [disabled]="model().addDisabled"
          (press)="addMarker.emit()"
        />
        <lib-synth-key
          data-control="loop-stop"
          label="Stop"
          icon="stop"
          [accessibleName]="model().stopAccessibleName"
          [disabled]="model().stopDisabled"
          (press)="stopLoop.emit()"
        />
      </div>
    </div>

    <lib-loop-selected-row
      [model]="model().selected"
      [startDragOffset]="startDragOffset()"
      [endDragOffset]="endDragOffset()"
      (trigger)="toggleSelected.emit()"
      (playNow)="playNowSelected.emit()"
      (toggleGlobal)="toggleGlobal.emit()"
      (setEnd)="setEnd.emit()"
      (clearEnd)="clearEnd.emit()"
      (deleteMarker)="deleteSelected.emit()"
      (nudgeInput)="nudgeInput.emit($event)"
      (nudgeCommit)="nudgeCommit.emit($event)"
      (snap)="snap.emit($event)"
      (rename)="rename.emit($event)"
    />

    <lib-loop-tile-grid
      data-control="loop-select"
      [tiles]="model().tiles"
      [accessibleName]="model().gridAccessibleName"
      [emptyText]="model().emptyText"
      (triggerTile)="triggerTile.emit($event)"
      (playNowTile)="playNowTile.emit($event)"
      (selectTile)="selectTile.emit($event)"
    />
  </section>
</lib-synth-panel>
