<lib-icon-button
  class="fold-button"
  size="medium"
  variant="standard"
  [icon]="folded() ? 'chevron_right' : 'chevron_left'"
  [ariaLabel]="folded() ? unfoldAccessibleName() : foldAccessibleName()"
  [ariaExpanded]="!folded()"
  (buttonClick)="onPress()"
/>

@if (folded()) {
<span class="strip-label" aria-hidden="true" [style.animation-duration.ms]="animationDuration()">{{
  label()
}}</span>
}
