<!-- Dialog Header -->
<div class="dialog-header">
  <mat-icon>edit</mat-icon>
  <h2>{{ title() }}</h2>
</div>

<!-- Form Field -->
<mat-form-field appearance="outline" class="preset-name-field">
  <mat-label>{{ fieldLabel() }}</mat-label>
  <input 
    matInput
    [value]="currentName()"
    (input)="currentName.set($any($event.target).value)"
    [attr.maxlength]="maxLength()"
    (keydown)="onKeyDown($event)"
    [placeholder]="placeholder()"
    [attr.aria-label]="inputAriaLabel()"
  />
  
  <!-- Character Counter -->
  <mat-hint align="end">
    <span [class.error-text]="currentName().length > maxLength()">
      {{ remainingChars() }}
    </span>
  </mat-hint>
  
  <!-- Validation Error -->
  @if (validationError()) {
    <mat-error>{{ validationError() }}</mat-error>
  }
</mat-form-field>

<!-- Action Buttons -->
<div class="button-row">
  <lib-icon-button
    [icon]="'check'"
    [ariaLabel]="saveLabel()"
    [tooltip]="saveTooltip()"
    [disabled]="!canSave()"
    (buttonClick)="onSaveClick()"
  />
  <lib-icon-button
    [icon]="'close'"
    [ariaLabel]="'Cancel'"
    [tooltip]="cancelTooltip"
    (buttonClick)="onCancelClick()"
  />
</div>
