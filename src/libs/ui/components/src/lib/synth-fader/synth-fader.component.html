<div class="fader" (wheel)="onWheel($event)" (dblclick)="onDoubleClick()">
  <span class="ticks" aria-hidden="true"></span>
  @if (homeFraction() !== null) {
  <span class="home" aria-hidden="true" [style.--synth-fader-home]="homeFraction()"></span>
  }
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    [attr.aria-label]="accessibleName()"
    [attr.aria-valuetext]="valueText()"
  />
</div>
