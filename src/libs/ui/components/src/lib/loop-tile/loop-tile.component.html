<lib-synth-key
  class="trigger"
  icon="play_arrow"
  [accessibleName]="model().triggerAccessibleName"
  [stateLight]="stateLight()"
  (press)="trigger.emit()"
/>
<lib-synth-key
  class="play-now"
  icon="bolt"
  [accessibleName]="model().playNowAccessibleName"
  (press)="playNow.emit()"
/>
<button
  type="button"
  class="select"
  [attr.aria-label]="model().selectAccessibleName"
  [attr.aria-current]="model().selected ? 'true' : null"
  (click)="selectTile.emit()"
>
  <span class="line">
    <span class="name">{{ model().name }}</span>
    @if (model().ownSettings) {
    <span class="own" aria-hidden="true"></span>
    }
    <span class="length" [class.length--cue]="model().kind === 'cue'">{{ model().lengthText }}</span>
  </span>
  <span #timeline class="timeline" [class.timeline--cue]="model().kind === 'cue'" aria-hidden="true">
    @if (model().kind === 'cue') {
    <span class="cue-tick"></span>
    } @else if (model().activity === 'running') {
    <span class="fill"></span>
    <span class="playhead"></span>
    }
  </span>
</button>
