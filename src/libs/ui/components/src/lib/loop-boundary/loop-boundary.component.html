<lib-synth-key
  class="key"
  data-part="key"
  [attr.data-control]="model().key.control"
  [label]="model().key.label"
  [accessibleName]="model().key.accessibleName"
  [disabled]="model().key.disabled"
  (press)="keyPress.emit()"
/>
<lib-synth-key
  data-part="move-earlier"
  icon="chevron_left"
  [accessibleName]="model().earlierAccessibleName"
  [disabled]="controlsDisabled()"
  (press)="moveEarlier.emit()"
/>
<div class="nudge">
  <input
    type="range"
    [min]="-model().rangeFrames"
    [max]="model().rangeFrames"
    step="1"
    [value]="shownOffset()"
    [disabled]="stripDisabled()"
    [attr.aria-label]="model().nudgeAccessibleName"
    [attr.aria-valuetext]="readout()"
    (input)="onInput($event)"
    (change)="onChange($event)"
  />
  <div class="strip" aria-hidden="true">
    <span class="centre"></span>
    @if (!model().empty) { @for (percent of model().tickPercents; track $index) {
    <span class="tick" [style.left.%]="percent"></span>
    } @if (model().rangeFrames > 0) {
    <span class="bar" [style.left.%]="barLeftPercent()" [style.width.%]="barWidthPercent()"></span>
    <span class="cap" [style.left.%]="valuePercent()"></span>
    } }
  </div>
</div>
<lib-synth-key
  data-part="move-later"
  icon="chevron_right"
  [accessibleName]="model().laterAccessibleName"
  [disabled]="controlsDisabled()"
  (press)="moveLater.emit()"
/>
<span class="readout" data-part="readout">{{ readout() }}</span>
