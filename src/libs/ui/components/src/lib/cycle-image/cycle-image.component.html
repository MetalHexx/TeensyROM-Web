<div
  class="image-container"
  [class.size-thumbnail]="size() === 'thumbnail'"
  [class.size-small]="size() === 'small'"
  [class.size-medium]="size() === 'medium'"
  [class.size-large]="size() === 'large'"
  [class.simple-mode]="isSimpleMode()"
  [ngStyle]="customStyles()"
>
  <!-- Blurred background - only in complex mode (medium/large) -->
  @if (!isSimpleMode()) {
  <!-- Blurred background - previous -->
  @if (showPrevious() && previousImage()) {
  <img [src]="previousImage()" alt="" class="background-image previous" crossorigin="anonymous" />
  }

  <!-- Blurred background - current -->
  @if (currentImage()) {
  <img [src]="currentImage()" alt="" class="background-image current" crossorigin="anonymous" />
  } }

  <!-- Previous image - fades out -->
  @if (showPrevious() && previousImage()) {
  <img [src]="previousImage()" alt="Previous image" class="carousel-image previous" crossorigin="anonymous" />
  }

  <!-- Current image - always visible -->
  @if (currentImage()) {
  <img
    [src]="currentImage()"
    alt="Current image"
    class="carousel-image current"
    crossorigin="anonymous"
    [@fadeIn]="animationKey()"
  />
  }
</div>
