@if (model().filter; as filter) {
  <lib-filter-mode-selector
    [model]="filter"
    [size]="size()"
    (modeSelect)="onFilterModeSelect($event)"
  />
}

@for (knob of model().knobs; track knob.id) {
  <lib-rotary-knob
    [label]="knob.label"
    [accessibleName]="knob.accessibleName"
    [value]="knob.value"
    [min]="knob.min ?? -1"
    [max]="knob.max ?? 1"
    [step]="knob.step ?? 0.01"
    [home]="knob.home ?? 0"
    [readout]="knob.readout ?? null"
    [disabled]="knob.disabled ?? false"
    [size]="size()"
    (valueChange)="onKnobChange(knob.id, $event)"
  />
}

<ng-content select="[deckStripAfterKnobs]" />

<div class="deck-strip-fader" [class.deck-strip-fader--fixed]="faderLength() !== null">
  <lib-channel-fader
    [value]="model().fader.value"
    [accessibleName]="model().fader.accessibleName"
    [label]="model().fader.label"
    [size]="size()"
    [length]="faderLength()"
    (valueChange)="onFaderChange($event)"
  />
</div>
