<div 
  (keydown)="onKeyDown($event)"
  tabindex="0"
  role="dialog"
  [attr.aria-label]="title()">
  <!-- Dialog Header with Warning Icon -->
  <div class="dialog-header">
    <lib-styled-icon icon="warning" color="error" size="large"></lib-styled-icon>
    <h2>{{ title() }}</h2>
  </div>

  <!-- Message Text -->
  <div class="dialog-message">
    <p>{{ message() }}</p>
  </div>

  <!-- Action Buttons -->
  <div class="button-row">
    @if (showLabels()) {
      <lib-action-button
        [icon]="cancelIcon()"
        [label]="cancelLabel()"
        [color]="'normal'"
        [fullWidth]="false"
        (buttonClick)="onCancelClick()"
      />
      <lib-action-button
        [icon]="confirmIcon()"
        [label]="confirmLabel()"
        [color]="'error'"
        [fullWidth]="false"
        (buttonClick)="onConfirmClick()"
      />
    } @else {
      <lib-icon-button
        [icon]="confirmIcon()"
        [ariaLabel]="confirmLabel()"
        [tooltip]="confirmTooltip()"
        [color]="'error'"
        (buttonClick)="onConfirmClick()"
      />
      <lib-icon-button
        [icon]="cancelIcon()"
        [ariaLabel]="cancelLabel()"
        [tooltip]="cancelTooltip()"
        (buttonClick)="onCancelClick()"
      />
    }
  </div>
</div>
