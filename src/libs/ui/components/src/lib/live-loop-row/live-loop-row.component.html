<div class="row">
  <lib-synth-key
    class="live"
    data-control="live-loop"
    label="Live"
    icon="loop"
    libHoldPress
    [holdDisabled]="model().disabled"
    [accessibleName]="model().liveLoopAccessibleName"
    [stateLight]="stateLight()"
    [disabled]="model().disabled"
    (holdChange)="onHold($event)"
  />
  <lib-loop-size-control
    class="size"
    tag="Size"
    readoutControl="live-loop-size"
    halveControl="live-loop-halve"
    doubleControl="live-loop-double"
    [model]="model().size"
    [disabled]="model().disabled"
    [halveDisabled]="!model().canHalve"
    [doubleDisabled]="!model().canDouble"
    [wheel]="true"
    (halve)="halve.emit()"
    (double)="double.emit()"
    (pickLength)="pickSize.emit($event)"
    (wheelTurn)="sizeWheel.emit($event)"
  />
  <lib-synth-key
    class="slip"
    data-control="slip"
    label="SLIP"
    [icon]="slipLamp()"
    [accessibleName]="model().slipAccessibleName"
    [latched]="model().slip"
    [disabled]="model().disabled"
    (press)="toggleSlip.emit()"
  />
</div>
