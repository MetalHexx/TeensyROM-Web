<div class="crossfader">
  @if (trackLength() !== null) {
    @if (startLabel() || endLabel()) {
      <div class="crossfader-labels">
        @if (startLabel()) {
          <span class="crossfader-label">{{ startLabel() }}</span>
        }
        @if (endLabel()) {
          <span class="crossfader-label">{{ endLabel() }}</span>
        }
      </div>
    }
  } @else if (startLabel()) {
    <span class="crossfader-label">{{ startLabel() }}</span>
  }
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    (input)="onInput($event)"
    [attr.aria-label]="accessibleName()"
  />
  @if (trackLength() === null && endLabel()) {
    <span class="crossfader-label">{{ endLabel() }}</span>
  }
</div>
