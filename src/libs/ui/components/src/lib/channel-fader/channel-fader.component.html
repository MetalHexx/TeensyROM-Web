<div class="channel-fader">
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    [attr.aria-label]="accessibleName()"
  />
  @if (label(); as labelText) {
  <span class="channel-fader-label">{{ labelText }}</span>
  }
</div>
