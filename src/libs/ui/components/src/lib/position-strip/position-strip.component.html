<input
  type="range"
  min="0"
  max="100"
  step="any"
  [value]="clampedPercent()"
  [disabled]="barState().kind === 'analyzing'"
  [attr.aria-label]="accessibleName()"
  [attr.aria-valuetext]="valueText()"
  (input)="onInput($event)"
  (change)="onChange($event)"
/>
@if (marks() !== null) {
<div class="lane" aria-hidden="true">
  @for (drawn of drawnMarks(); track drawn.mark.id) {
  <span
    class="mark"
    [attr.data-kind]="drawn.mark.kind"
    [attr.data-activity]="drawn.mark.activity"
    [attr.data-selected]="drawn.mark.selected ? '' : null"
    [style.left.%]="drawn.left"
    [style.width.%]="drawn.width"
  ></span>
  }
</div>
}
<div class="strip" [attr.data-state]="barState().kind" aria-hidden="true">
  <div class="track">
    @if (barState().kind !== 'analyzing') {
    <span class="fill" [style.width.%]="clampedPercent()" [style.--fill-split]="fillSplit()"></span>
    } @if (loopMarkPercent() !== null) {
    <span class="loop-mark" [style.left.%]="loopMarkPercent()"></span>
    } @if (barState().kind !== 'analyzing') {
    <span
      class="playhead"
      [attr.data-held]="held() ? '' : null"
      [style.left.%]="clampedPercent()"
    ></span>
    }
  </div>
</div>
