<div class="input-wrapper">
  <div class="input-area" [libTooltip]="tooltip()">
    @if (!value) {
    <mat-icon class="search-icon">search</mat-icon>
    }
    <input
      class="input-field"
      [type]="inputType()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value"
      [attr.aria-label]="placeholder()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  </div>
  @if (clearable() && value) {
  <button 
    type="button"
    class="clear-button" 
    (click)="onClear()"
    [attr.aria-label]="'Clear search'"
    [libTooltip]="clearTooltip()"
  >
    <mat-icon>close</mat-icon>
  </button>
  }
</div>
