<div
  class="crt-wrapper"
  [class.crt-enabled]="enabled()"
  [style.--scanline-intensity]="settings().scanlineIntensity"
  [style.--scanline-thickness.px]="settings().scanlineThickness"
  [style.--scanline-spacing.px]="settings().scanlineSpacing"
  [style.--vignette-strength]="settings().vignetteStrength"
  [style.--screen-curvature.px]="settings().screenCurvature"
  [style.--crt-contrast]="settings().contrast"
  [style.--crt-brightness]="settings().brightness"
  [style.--crt-saturation]="settings().saturation"
>
  <div class="crt-content">
    <ng-content></ng-content>
  </div>
</div>
