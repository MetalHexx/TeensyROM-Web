<button
  mat-icon-button
  [class]="buttonClasses()"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  [libTooltip]="tooltip()"
  (click)="onButtonClick()"
>
  @if (hasIcon()) {
  <mat-icon [class]="iconClasses()">{{ icon() }}</mat-icon>
  } @else {
  <!-- ng-content for custom icon components -->
  <span [class]="iconClasses()" class="custom-icon">
    <ng-content></ng-content>
  </span>
  }
</button>
