<div class="video-stream-container">
  <video
    #videoElement
    autoplay
    muted
    playsinline
    class="video-element"
    [class.video-element--inert]="disableNativeOverlays()"
    [attr.disablepictureinpicture]="disableNativeOverlays() ? '' : null"
    [attr.disableremoteplayback]="disableNativeOverlays() ? '' : null"
    [style.objectFit]="objectFit()"
    (playing)="onVideoPlaying()"
    (error)="onVideoError($event)"
    aria-label="Video stream display"
    role="img"
  ></video>

  @if (showLoading()) {
    <div class="loading-overlay" aria-live="polite" aria-busy="true">
      <span class="loading-text">Loading video...</span>
    </div>
  }
</div>
