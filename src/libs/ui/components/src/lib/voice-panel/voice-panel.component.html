<section class="panel" [attr.aria-label]="model().accessibleName">
  <h2>Voice</h2>

  <div class="voice-rows">
    @for (row of model().rows; track row.checkboxId) {
      <lib-voice-row
        [attr.data-voice]="$index + 1"
        [model]="row"
        [disabled]="model().disabled ?? false"
        (mutedChange)="onMutedChange($index, $event)"
        (heldChange)="onHeldChange($index, $event)"
      />
    }
  </div>

  <div class="voice-clear">
    <button
      type="button"
      data-control="clear-voice-mutes"
      [attr.aria-label]="model().clearAccessibleName"
      [disabled]="model().disabled ?? false"
      (click)="clearMutes.emit()"
    >
      Clear
    </button>
  </div>
</section>
