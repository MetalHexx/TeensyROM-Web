<div class="voice-row-line">
  <input
    type="checkbox"
    [id]="model().checkboxId"
    [attr.aria-label]="model().muteAccessibleName"
    [checked]="model().muted"
    [disabled]="disabled()"
    (change)="onMutedChange($event)"
  />
  <label [for]="model().checkboxId">{{ model().label }}</label>
</div>

<button
  type="button"
  class="voice-hold"
  [attr.aria-label]="model().holdAccessibleName"
  [disabled]="disabled()"
  (pointerdown)="onHoldStart($event)"
  (pointerup)="onHoldEnd()"
  (pointercancel)="onHoldEnd()"
  (keydown)="onHoldKeyDown($event)"
  (keyup)="onHoldKeyUp($event)"
  (blur)="onHoldBlur()"
>
  {{ model().holdLabel }}
</button>
