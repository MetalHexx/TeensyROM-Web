<div class="voice-row-line" data-control="voice-mute">
  <input
    type="checkbox"
    [id]="model().checkboxId"
    [attr.aria-label]="model().muteAccessibleName"
    [checked]="model().muted"
    [disabled]="disabled()"
    (change)="onMutedChange($event)"
  />
  <label [for]="model().checkboxId">{{ model().label }}</label>
</div>

<button
  type="button"
  class="voice-hold"
  data-control="voice-hold"
  [attr.aria-label]="model().holdAccessibleName"
  [disabled]="disabled()"
  libHoldPress
  [holdDisabled]="disabled()"
  (holdChange)="heldChange.emit($event)"
>
  {{ model().holdLabel }}
</button>
