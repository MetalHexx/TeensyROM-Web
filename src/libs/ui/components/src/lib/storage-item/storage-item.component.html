<div class="storage-item no-text-selection">
  <div class="storage-item-label-area">
    <lib-icon-label
      [icon]="icon()"
      [color]="iconColor()"
      size="medium"
      [truncate]="false"
      [label]="label()"
    >
    </lib-icon-label>
    <ng-content select="[storageItemAfterLabel]"></ng-content>
  </div>

  <ng-content select="lib-storage-item-actions"></ng-content>
</div>
