<mat-card [class]="computedCardClass()" class="stretch-card" style="position: relative">
  <!-- Corner content projection -->
  <div #cornerContent class="corner-content">
    <ng-content select="[slot=corner]"></ng-content>
  </div>

  <!-- Header section - use CSS :empty to hide when no content -->
  <mat-card-header>
    <!-- Header slot projection - appears above title/subtitle -->
    <ng-content select="[slot=header]"></ng-content>
    
    <ng-container>
      @if (title()) {
        <mat-card-title>{{ title() }}</mat-card-title>
      }
      @if (subtitle()) {
        <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
      }
    </ng-container>
  </mat-card-header>
  
  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>

  @if (metadataSource()) {
  <mat-card-footer>
    <p class="metadata-source">{{ metadataSource() }}</p>
  </mat-card-footer>
  }
</mat-card>
