@if (tiles().length === 0) { @if (emptyText(); as text) {
<p class="empty">{{ text }}</p>
} } @else {
<div class="grid" role="list" [attr.aria-label]="accessibleName()">
  @for (tile of tiles(); track tile.id) {
  <div role="listitem" class="item" [attr.data-selected]="tile.selected ? '' : null">
    <lib-loop-tile
      [model]="tile"
      (trigger)="triggerTile.emit(tile.id)"
      (playNow)="playNowTile.emit(tile.id)"
      (selectTile)="selectTile.emit(tile.id)"
    />
  </div>
  }
</div>
}
