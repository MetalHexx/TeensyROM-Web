<div class="top">
  <lib-synth-key
    class="trigger"
    data-control="loop-toggle"
    icon="play_arrow"
    [accessibleName]="model().triggerAccessibleName"
    [stateLight]="stateLight()"
    [disabled]="model().empty || model().triggerDisabled"
    pressOn="down"
    (press)="trigger.emit()"
  />
  <lib-synth-key
    class="play-now"
    data-control="loop-play-now"
    icon="bolt"
    [accessibleName]="model().playNowAccessibleName"
    [disabled]="model().empty || model().playNowDisabled"
    pressOn="down"
    (press)="playNow.emit()"
  />
  <div
    class="display"
    role="group"
    [attr.aria-label]="displayText()"
    [attr.data-renaming]="renaming() ? '' : null"
  >
    @if (!model().empty) {
    <span class="name">
      @if (model().renameDisabled) {
      {{ model().name }}
      } @else {
      <lib-inline-edit-title
        [value]="editorValue()"
        [maxLength]="model().nameMaxLength"
        [editLabel]="model().renameLabel"
        (commit)="onCommit($event)"
      />
      }
    </span>
    <span class="kind" aria-hidden="true">{{ model().kindLabel }}</span>
    <span class="span" aria-hidden="true">{{ model().spanText }}</span>
    }
  </div>
  <lib-synth-key
    class="global"
    data-control="loop-global"
    label="GBL"
    [icon]="globalLamp()"
    [accessibleName]="model().globalAccessibleName"
    [latched]="globalLatched()"
    [disabled]="model().empty || model().globalDisabled"
    (press)="toggleGlobal.emit()"
  />
  <lib-synth-key
    class="wrap"
    data-control="loop-wrap"
    label="WRAP"
    [icon]="wrapLamp()"
    [accessibleName]="model().wrapAccessibleName"
    [latched]="wrapLatched()"
    [disabled]="model().empty || model().wrapDisabled"
    (press)="toggleWrap.emit()"
  />
  <lib-synth-key
    class="icon-only"
    data-control="loop-delete"
    icon="delete"
    [accessibleName]="model().deleteAccessibleName"
    [disabled]="model().empty || model().deleteDisabled"
    (press)="deleteMarker.emit()"
  />
</div>
<div class="controls">
  <lib-loop-size-control
    readoutControl="loop-length"
    stepDownControl="loop-length-down"
    stepUpControl="loop-length-up"
    [model]="model().length"
    [disabled]="model().empty"
    (halve)="halve.emit()"
    (double)="double.emit()"
    (stepLength)="stepLength.emit($event)"
    (pickNoEnd)="clearEnd.emit()"
    (pickLength)="pickLength.emit($event)"
  />
  <div class="control">
    <span class="tag" aria-hidden="true">Move</span>
    <lib-synth-key
      class="step"
      data-control="loop-move-earlier"
      icon="arrow_back"
      [accessibleName]="model().move.earlierAccessibleName"
      (press)="moveEarlier.emit()"
    />
    @if (model().move.options.length > 0) {
    <lib-dropdown-menu #moveMenu>
      <button
        type="button"
        class="readout"
        data-control="loop-move-step"
        aria-haspopup="menu"
        [attr.aria-label]="model().move.pickAccessibleName + ', ' + model().move.stepText"
        (click)="moveMenu.toggle()"
      >
        {{ model().move.stepText }}<span class="caret" aria-hidden="true">▾</span>
      </button>
      <div dropdown-content>
        @for (option of model().move.options; track option.beats) {
        <lib-dropdown-menu-item [selected]="option.selected" (itemClick)="pickMoveStep.emit(option.beats)">
          {{ option.label }}
        </lib-dropdown-menu-item>
        }
      </div>
    </lib-dropdown-menu>
    } @else {
    <span class="readout" data-control="loop-move-step">{{ model().move.stepText }}</span>
    }
    <lib-synth-key
      class="step"
      data-control="loop-move-later"
      icon="arrow_forward"
      [accessibleName]="model().move.laterAccessibleName"
      (press)="moveLater.emit()"
    />
  </div>
</div>
