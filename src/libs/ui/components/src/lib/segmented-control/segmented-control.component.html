<div class="segmented-control" role="radiogroup" [attr.aria-label]="accessibleName()">
  @for (option of options(); track option.id; let index = $index) {
  <button
    #segment
    type="button"
    role="radio"
    class="segment"
    [class.segment--selected]="option.id === selectedId()"
    [attr.aria-checked]="option.id === selectedId()"
    [attr.tabindex]="option.id === tabStopId() ? 0 : -1"
    [disabled]="option.disabled ?? false"
    (click)="select(option)"
    (keydown)="onKeydown($event, index)"
  >
    {{ option.label }}
  </button>
  }
</div>
